<script>
window.APP_LANG_LISTENERS = [];
(function(){
  var POOL = ("ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎㅏㅑㅓㅕㅗㅛㅜㅠㅡㅣ"
    + "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-·").split("");
  function esc(c){return c==="&"?"&amp;":c==="<"?"&lt;":c===">"?"&gt;":c;}
  function Scramble(el){ this.el=el; this.raf=null; this.frame=this.frame.bind(this); }
  Scramble.prototype.set=function(txt){
    var old = this.el.dataset.plain!==undefined ? this.el.dataset.plain : this.el.textContent;
    var len=Math.max(old.length, txt.length);
    this.q=[];
    for(var i=0;i<len;i++){
      var from=old[i]||"", to=txt[i]||"";
      var start=Math.floor(Math.random()*20);
      var end=start+Math.floor(Math.random()*25)+12;
      this.q.push({from:from,to:to,start:start,end:end,ch:null});
    }
    if(this.raf) cancelAnimationFrame(this.raf);
    this.f=0; this.txt=txt; this.frame();
  };
  Scramble.prototype.frame=function(){
    var out="", done=0;
    for(var i=0;i<this.q.length;i++){
      var it=this.q[i];
      if(this.f>=it.end){ done++; out+=esc(it.to); }
      else if(this.f>=it.start){
        if(!it.ch || Math.random()<0.3){ it.ch=POOL[Math.floor(Math.random()*POOL.length)]; }
        out+='<span class="scr">'+esc(it.ch)+'</span>';
      } else out+=esc(it.from);
    }
    this.el.innerHTML=out;
    if(done===this.q.length){ this.el.dataset.plain=this.txt; }
    else { this.f++; this.raf=requestAnimationFrame(this.frame); }
  };
  var els=[].slice.call(document.querySelectorAll('.tx'));
  els.forEach(function(el){ el.dataset.plain=el.textContent; el._s=new Scramble(el); });
  (function(){
    var L = window.KYG_LANG || 'en';
    var btns=document.querySelectorAll('#langtoggle button');
    for(var i=0;i<btns.length;i++){ btns[i].classList.toggle('on', btns[i].dataset.lang===L); }
    if(L!=='en') els.forEach(function(el){ var t=el.dataset[L]; if(t!==undefined){ el.textContent=t; el.dataset.plain=t; } });
    document.documentElement.classList.remove('lang-pending');
  })();
  function setLang(lang){
    if(lang===window.APP_LANG) return;
    window.APP_LANG = lang;
    try{ localStorage.setItem('kyg_lang', lang); }catch(e){}
    document.documentElement.lang = (lang==='kr'?'ko':'en');
    var btns=document.querySelectorAll('#langtoggle button');
    for(var i=0;i<btns.length;i++){ btns[i].classList.toggle('on', btns[i].dataset.lang===lang); }
    els.forEach(function(el){ var t=el.dataset[lang]; if(t!==undefined) el._s.set(t); });
    window.APP_LANG_LISTENERS.forEach(function(fn){ try{ fn(lang); }catch(e){ console.error(e); } });
  }
  document.getElementById('langtoggle').addEventListener('click', function(e){
    var b=e.target.closest('button'); if(b) setLang(b.dataset.lang);
  });
  /* .tx가 아닌 요소도 같은 효과를 쓸 수 있게 열어둔다 (로그인 시 닉네임 전환) */
  window.KYG_SCRAMBLE=function(el,txt){ if(!el) return; if(!el._s) el._s=new Scramble(el); el._s.set(txt); };
})();
</script>

/* ---------- 비로그인 화면: RPC를 한 개도 부르지 않는다 ---------- */
function renderGuest(){
  var h = '<div class="card"><div class="card-head"><h2>' + esc(L({en:'SIGN IN',kr:'로그인'})) + '</h2></div>';
  h += '<p class="blurb">' + esc(L(U.guestLead)) + '</p><ul class="glist">';
  CARDS.forEach(function(c){
    h += '<li><b>' + esc(L(c.label)) + '</b><span>' + esc(L(c.blurb)) + '</span>' +
         '<a href="' + c.href + '">' + esc(L(U.guestGo)) + '</a></li>';
  });
  h += '</ul>';
  h += '<p class="foot">' + esc(L(U.guestSignIn)) + '</p></div>';
  h += '<div class="note">' + esc(L(U.guestFromNow)) + '</div>';
  $('guest').innerHTML = h;
  $('cards').innerHTML = '';
}

/* 난이도 이름. DB 값은 내부 키이고 게임이 화면에 쓰는 이름은 따로다.
   지도에 없는 값은 원값을 그대로 보여준다 — 게임이 난이도를 새로 추가했을 때
   빈칸이 되는 대신 눈에 띄게 남아서 지도를 고치라는 신호가 된다. */
function deskName(c, d){
  if (d == null || d === '') return '—';
  var m = c.desks && c.desks[d];
  return m ? L(m) : String(d).toUpperCase();
}

/* ---------- 표 ---------- */
function table(c, rows){
  var h = '<div class="tblwrap"><table><thead><tr><th>' + esc(L(U.desk)) + '</th>';
  c.cols.forEach(function(col){ h += '<th>' + esc(L(col.l)) + '</th>'; });
  h += '</tr></thead><tbody>';
  rows.forEach(function(r){
    h += '<tr><td>' + esc(deskName(c, r.difficulty)) + '</td>';
    c.cols.forEach(function(col){
      h += '<td>' + (col.calc ? esc(col.calc(r)) : col.f(r[col.k])) + '</td>';
    });
    h += '</tr>';
  });
  if (rows.length > 1){
    var t = {};
    c.cols.forEach(function(col){
      if (col.sum) t[col.k] = rows.reduce(function(a, r){ return a + (Number(r[col.k]) || 0); }, 0);
    });
    h += '<tr class="tot"><td>' + esc(L(U.total)) + '</td>';
    c.cols.forEach(function(col){
      h += '<td>' + (col.calc ? esc(col.calc(t)) : (col.sum ? col.f(t[col.k]) : '—')) + '</td>';
    });
    h += '</tr>';
  }
  return h + '</tbody></table></div>';
}

/* ---------- 카드 하나. 실패는 이 안에서 끝난다 ---------- */
function shell(c, body, extra){
  return '<div class="card" id="card-' + c.key + '"><div class="card-head"><h2>' +
         esc(L(c.label)) + '</h2>' + (extra || '') + '</div>' +
         '<p class="blurb">' + esc(L(c.blurb)) + '</p>' + body + '</div>';
}

function paintCard(c, state){
  var el = $('card-' + c.key);
  var body, extra = '';
  if (state.err){
    body = '<p class="err">' + esc(L(U.failed)) + '</p>';
  } else if (state.loading){
    body = '<p class="empty">' + esc(L(U.loading)) + '</p>';
  } else if (!state.rows || !state.rows.length){
    body = '<p class="empty">' + esc(L(U.none)) + ' <a href="' + c.href + '">' +
           esc(L(U.noneGo)) + '</a></p>';
  } else {
    var n = state.rows.reduce(function(a, r){ return a + (Number(r.games) || 0); }, 0);
    extra = '<span class="tot">' + n.toLocaleString() + ' ' + esc(L(U.totGames)) + '</span>';
    body = table(c, state.rows) +
      '<div class="actions"><button class="del" data-key="' + c.key + '">' +
      esc(state.delMsg || L(U.del)) + '</button></div>';
  }
  var html = shell(c, body, extra);
  if (el) el.outerHTML = html; else $('cards').insertAdjacentHTML('beforeend', html);
}

/* ---------- 로그인 화면 ---------- */
var STATE = {};       /* key → {loading, rows, err, delMsg, armed} */
var CLIENT = null;

function renderCards(){
  $('guest').innerHTML = '';
  $('cards').innerHTML = '';
  CARDS.forEach(function(c){ paintCard(c, STATE[c.key] || { loading:true }); });
  $('cards').insertAdjacentHTML('beforeend', '<div class="note">' + esc(L(U.privacy)) + '</div>');
}

function load(){
  CARDS.forEach(function(c){
    STATE[c.key] = { loading:true };
    /* 카드마다 따로 부르고 따로 실패한다. 하나가 죽어도 나머지는 그대로 뜬다. */
    CLIENT.rpc(c.rpc).then(function(res){
      if (res.error) throw res.error;
      STATE[c.key] = { rows: res.data || [] };
    }).catch(function(e){
      console.warn('/me/: ' + c.rpc + ' failed', e);
      STATE[c.key] = { err:true };
    }).then(function(){ paintCard(c, STATE[c.key]); });
  });
}

/* ---------- 삭제 — 브라우저 대화상자 없이 두 번 눌러 확인 ---------- */
function missingFn(e){
  var m = ((e && (e.message || e.hint || '')) + ' ' + (e && e.code || '')).toLowerCase();
  return m.indexOf('pgrst202') >= 0 || m.indexOf('could not find the function') >= 0 ||
         m.indexOf('does not exist') >= 0;
}
document.addEventListener('click', function(ev){
  var b = ev.target.closest && ev.target.closest('button.del');
  if (!b || !CLIENT) return;
  var key = b.dataset.key, c = null, i;
  for (i = 0; i < CARDS.length; i++) if (CARDS[i].key === key) c = CARDS[i];
  if (!c) return;
  var st = STATE[key] || {};
  if (!st.armed){
    st.armed = true; st.delMsg = L(U.delSure); STATE[key] = st; paintCard(c, st);
    setTimeout(function(){
      var s = STATE[key];
      if (s && s.armed){ s.armed = false; s.delMsg = null; paintCard(c, s); }
    }, 6000);
    return;
  }
  st.armed = false; st.delMsg = null;
  CLIENT.rpc(c.del).then(function(res){
    if (res.error) throw res.error;
    STATE[key] = { rows: [] };
  }).catch(function(e){
    console.warn('/me/: ' + c.del + ' failed', e);
    STATE[key] = Object.assign({}, st, { delMsg: missingFn(e) ? L(U.delMissing) : L(U.delFail) });
  }).then(function(){ paintCard(c, STATE[key]); });
});

/* ---------- 제목: 로그인하면 닉네임이 된다 ----------
   닉네임은 이미 모든 페이지 좌하단 칩에 떠 있고 profiles가 공개 읽기라
   여기 띄운다고 새로 새는 정보는 없다. 문서 제목(<title>)은 일부러 안 바꾼다 —
   브라우저 기록과 탭 목록에 남는 자리라 중립으로 두는 게 낫다. */
function setName(nick){
  var pre = $('wpre'), box = $('wbox');
  if (!pre || !box) return;
  var name = (nick && String(nick).trim()) ? String(nick).trim() : null;
  var txt  = name || 'E';
  pre.style.display = name ? 'none' : '';

  /* 닉네임은 2~16자이고 한글은 한 글자가 라틴 두 배 폭이라, 글자 수로 크기를 추정하면
     빗나간다. 실제로 그려서 재고 들어갈 때까지 줄인다 — 한 번만 도는 루프다. */
  var h1 = $('who'), prev = box.textContent;
  if (h1){
    box.textContent = txt;
    h1.style.fontSize = '';
    var size = parseFloat(getComputedStyle(h1).fontSize) || 72;
    var guard = 0;
    while (h1.scrollWidth > h1.clientWidth && size > 22 && guard++ < 40){
      size -= 2; h1.style.fontSize = size + 'px';
    }
    box.textContent = prev;
  }
  if (box.dataset.plain === txt && box.textContent === txt) return;

  /* 애니메이션을 못 믿는 두 경우에는 아예 돌리지 않는다.
     · 탭이 배경이면 requestAnimationFrame이 멈춘다 — 라이브에서 실제로 겪었다.
       프레임 8에서 얼어붙어 제목이 'EyP' 상태로 남았다.
     · 동작 줄이기를 켠 사용자에게는 글자가 튀는 효과를 보일 이유가 없다.
     제목은 이 페이지의 신원이라 반쯤 뒤섞인 채로 남으면 본문 라벨보다 나쁘다. */
  var still = (typeof document.visibilityState === 'string' && document.visibilityState !== 'visible') ||
              (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  function settle(){
    if (box.dataset.plain === txt && box.textContent === txt) return;
    if (box._s && box._s.raf) cancelAnimationFrame(box._s.raf);
    box.textContent = txt;
    box.dataset.plain = txt;
  }
  if (still || !window.KYG_SCRAMBLE){ settle(); return; }
  window.KYG_SCRAMBLE(box, txt);
  /* 그물망. 언어 유지 패치의 lang-pending 2초 타이머와 같은 계열 —
     효과가 죽어도 영원히 이상한 상태에 갇히지 않는다. */
  clearTimeout(setName._t);
  setName._t = setTimeout(settle, 3500);
}

/* ---------- 배선 ---------- */
renderGuest();   /* 위젯이 뜨기 전에도 빈 화면을 보이지 않는다 */

window.KYG_AUTH_LISTENERS = window.KYG_AUTH_LISTENERS || [];
window.KYG_AUTH_LISTENERS.push(function(user, nickname, client){
  setName(user ? nickname : null);
  if (user && client){
    CLIENT = client;
    renderCards();
    load();
  } else {
    CLIENT = null; STATE = {};
    renderGuest();
  }
});

window.APP_LANG_LISTENERS.push(function(){
  if (CLIENT) renderCards(); else renderGuest();
  if (CLIENT) CARDS.forEach(function(c){ paintCard(c, STATE[c.key] || { loading:true }); });
});
})();
</script>
<script src="/auth-widget.js" defer></script>
