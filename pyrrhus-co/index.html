<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pyrrhus &amp; Co. — KYGMIN</title>
<meta name="description" content="4인 밀봉 경매. 20라운드. 하우스는 항상 이긴다." />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script>
window.KYG_LANG=(function(){try{var v=localStorage.getItem('kyg_lang');if(v==='kr'||v==='en')return v;}catch(e){}return 'en';})();
window.APP_LANG=window.KYG_LANG;
window.APP_LANG_LISTENERS=[];
if(window.KYG_LANG!=='en'){
  document.documentElement.setAttribute('lang','ko');
  document.documentElement.className+=' lang-pending';
  setTimeout(function(){document.documentElement.classList.remove('lang-pending');},2000);
}
</script>
<style>html.lang-pending .tx{visibility:hidden}</style>
<style>
/* ============================================================
   피로스 옥션 하우스 — MONO × GREEN 네오브루탈리스트.
   토큰은 pyrrhus-co-reveal-v1.2.html 과 동일하다.
   ============================================================ */
:root{
  --paper:#F6F6F4;
  --white:#FFFFFF;
  --sunken:#EFEFEA;
  --ink:#141414;
  --ink-4:#6B6B67;
  --ink-6:#9A9A95;
  --gray:#DDDDD8;
  --green:#2BB673;
  --green-deep:#0F6E56;
  --red:#A32D2D;
  --gold:#C89A00;

  --arch:'Archivo','Helvetica Neue',Arial,sans-serif;
  --sans:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;

  --art-size:288px;
  /* 리빌 규격 (reveal-v1.2): 작품 336px = 24×24 스프라이트 ×14,
     스탬프 232px = 48×48 스탬프 ×4.83 (작품의 69%) */
  --rv-art:336px;
  --rv-stamp:232px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  word-break:keep-all;overflow-wrap:break-word;
}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:0 24px}

/* ── Nav ── */
nav{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:3px solid var(--ink)}
.nav-inner{max-width:960px;margin:0 auto;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.logo{font-family:var(--arch);font-weight:900;font-size:19px;letter-spacing:-0.5px}
.logo em{font-style:normal;background:var(--green);color:var(--paper);padding:0 6px;display:inline-block;transform:rotate(-1.5deg)}
.nav-links{display:flex;gap:8px;flex-wrap:wrap}
.nav-links a{font-family:var(--arch);font-size:12px;font-weight:700;text-transform:uppercase;
  border:2px solid var(--ink);padding:6px 13px;background:#fff;box-shadow:3px 3px 0 var(--ink);
  transition:transform .1s,box-shadow .1s}
.nav-links a:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.nav-links a.on{background:var(--green);color:var(--paper)}

/* ── 언어 토글 ── */
#langtoggle{position:fixed;right:20px;bottom:20px;z-index:50;display:inline-flex;
  border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:#fff;
  font-family:var(--arch);font-weight:700;font-size:12px;overflow:hidden}
#langtoggle button{font:inherit;border:none;background:none;cursor:pointer;padding:9px 14px;color:var(--ink);letter-spacing:.5px}
#langtoggle button.on{background:var(--green);color:var(--paper)}
#langtoggle button+button{border-left:2px solid var(--ink)}

/* ── Hero ── */
header{padding:52px 0 34px;border-bottom:3px solid var(--ink)}
.sec-tag{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--green-deep);letter-spacing:1px;display:block;margin-bottom:14px}
h1{font-family:var(--arch);font-weight:900;text-transform:uppercase;font-size:clamp(32px,6vw,52px);line-height:1.04;letter-spacing:-2px}
h1 .box{background:var(--ink);color:var(--paper);padding:0 12px;display:inline-block;transform:rotate(-1deg)}
.hero-sub{margin-top:18px;font-size:15.5px;max-width:620px;font-weight:500}
.hero-note{margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--ink-4)}

main{padding:34px 0 96px}

/* ── 공통 파츠 ── */
.panel{border:3px solid var(--ink);background:var(--white);box-shadow:6px 6px 0 var(--ink);padding:22px}
.btn{display:inline-block;font-family:var(--arch);font-size:13px;font-weight:700;text-transform:uppercase;
  border:3px solid var(--ink);padding:11px 20px;box-shadow:4px 4px 0 var(--ink);
  transition:transform .1s,box-shadow .1s;background:#fff;cursor:pointer;color:var(--ink)}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn-green{background:var(--green);color:var(--paper)}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn[hidden]{display:none}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:disabled:hover{transform:none;box-shadow:4px 4px 0 var(--ink)}
.btn-sm{font-size:11px;padding:6px 11px;box-shadow:3px 3px 0 var(--ink);border-width:2px}
.btn-sm:hover{box-shadow:2px 2px 0 var(--ink)}
.btn-sm:disabled:hover{box-shadow:3px 3px 0 var(--ink)}
.label{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;color:var(--ink-6);text-transform:uppercase}
.mono{font-family:var(--mono)}
.n{font-family:var(--arch);font-weight:900;letter-spacing:-0.5px;font-variant-numeric:tabular-nums;line-height:1.1}

/* 피로스 대사 */
.say{display:flex;gap:12px;align-items:flex-start;border-left:3px solid var(--ink);
  background:var(--sunken);padding:11px 14px;margin-bottom:20px}
.say .hat{flex:0 0 auto;width:22px;height:22px;margin-top:2px}
.say .v{font-size:14.5px;line-height:1.6}
.say.quiet{visibility:hidden}

/* ── 개회 ── */
#screen-open .rules{margin:18px 0 22px;border-top:2px solid var(--gray);border-bottom:2px solid var(--gray);padding:14px 0}
#screen-open .rules div{display:flex;gap:12px;font-size:14px;padding:4px 0;align-items:baseline}
#screen-open .rules b{flex:0 0 116px;font-family:var(--mono);font-size:11px;letter-spacing:1px;
  color:var(--ink-6);font-weight:600;text-transform:uppercase}
.tier-row{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0 8px}
.tier{font-family:var(--arch);font-size:12.5px;font-weight:700;text-transform:uppercase;
  border:3px solid var(--ink);padding:9px 15px;background:#fff;cursor:pointer;box-shadow:4px 4px 0 var(--ink);
  transition:transform .1s,box-shadow .1s}
.tier:hover{transform:translate(1px,1px);box-shadow:3px 3px 0 var(--ink)}
.tier.on{background:var(--ink);color:var(--paper)}
.tier-note{font-size:13px;color:var(--ink-4);min-height:2.4em;margin-bottom:18px;max-width:60ch}

/* ── 라운드 ── */
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  border:3px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 16px;margin-bottom:20px}
.hud .lot{font-family:var(--arch);font-weight:900;font-size:15px;letter-spacing:.5px;text-transform:uppercase}
.hud .stats{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:12px}
.hud .stats b{color:var(--green);font-weight:600}

.stage{display:grid;grid-template-columns:var(--art-size) 1fr;gap:28px;align-items:start}
.art{width:var(--art-size);height:var(--art-size);background:var(--sunken);border:3px solid var(--ink);
  display:flex;align-items:center;justify-content:center}
.art svg{width:100%;height:100%}
.lot-name{font-family:var(--arch);font-weight:700;font-size:21px;letter-spacing:-0.5px;margin:6px 0 8px}
.lot-desc{font-size:14px;line-height:1.7;color:var(--ink);max-width:52ch}

.est{display:flex;gap:0;margin:18px 0 0;border:3px solid var(--ink)}
.est > div{flex:1;padding:9px 13px;display:flex;flex-direction:column;gap:2px}
.est > div + div{border-left:3px solid var(--ink)}
.est .n{font-size:19px}
.est .wide{color:var(--green-deep)}

.appr{margin-top:16px;border:3px solid var(--ink);background:var(--sunken);padding:12px 14px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.appr .got{display:flex;flex-direction:column;gap:2px}
.appr .got .n{font-size:22px;color:var(--green-deep);white-space:nowrap}
.appr .hint{font-size:12px;color:var(--ink-4);flex-basis:100%}
/* 감정 소견 한 줄. 폭 밑에 붙는 도장이지 버튼이 아니다 — 테두리를 주지 않는다. */
.appr-verdict{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;font-weight:700;
  display:inline-block;align-self:flex-start;padding:3px 9px;
  background:var(--green);color:var(--paper)}
.appr-verdict.fake{background:var(--ink);color:var(--paper)}

.bidbox{margin-top:16px;border:3px solid var(--ink);padding:14px}
.bidrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.bidrow .cur{font-family:var(--arch);font-weight:900;font-size:22px}
input[type=number]{font-family:var(--arch);font-weight:900;font-size:22px;letter-spacing:-0.5px;
  border:3px solid var(--ink);background:#fff;padding:6px 10px;width:170px;color:var(--ink);
  font-variant-numeric:tabular-nums}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.bid-hint{font-family:var(--mono);font-size:11.5px;color:var(--ink-4);margin-top:10px;min-height:1.6em}
.bid-hint.bad{color:var(--red)}
.bidact{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* ── 순위/좌석표 ── */
.board{border:3px solid var(--ink);background:var(--white);box-shadow:5px 5px 0 var(--ink);margin-top:24px}
.board .bh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:3px solid var(--ink);font-family:var(--mono);font-weight:600;font-size:10.5px;
  letter-spacing:1.4px;text-transform:uppercase}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 14px;text-align:left;font-family:var(--mono);font-size:12px;border-bottom:2px solid var(--gray)}
th{color:var(--ink-6);font-weight:600;font-size:10px;letter-spacing:1.2px;text-transform:uppercase}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tr.you td{background:var(--sunken);font-weight:600}
.seat-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border:2px solid var(--ink);font-family:var(--mono);font-size:9px;font-weight:600;margin-right:7px;
  vertical-align:-4px}

/* ── 라운드 결과 ── */
.verdict{border:3px solid var(--ink);padding:16px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.verdict.won{background:var(--green);color:var(--paper)}
.verdict.lost{background:var(--white)}
.verdict.passed{background:var(--gray)}
.verdict .ico{flex:0 0 auto;width:34px;height:34px}
/* 가운데 칸(작은 라벨 + 이름)은 세로로 쌓는다. 안 그러면 한 줄로 붙어 버린다. */
.verdict>span:not(.ico):not(.amt){display:flex;flex-direction:column;gap:4px;min-width:0}
.verdict .who{font-family:var(--arch);font-weight:900;font-size:19px;letter-spacing:-0.5px}
.verdict.won .label{color:#D8F3E6}
.verdict .amt{font-family:var(--arch);font-weight:900;font-size:26px;letter-spacing:-1px;margin-left:auto;font-variant-numeric:tabular-nums}
.disclose{margin-top:16px;border-top:2px solid var(--gray);padding-top:13px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.disclose .ico{flex:0 0 auto;width:20px;height:20px;margin-top:2px}

/* 소장품 */
.holdings{margin-top:22px}
.hold-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:11px;margin-top:10px}
.hold{border:3px solid var(--ink);background:var(--white);padding:9px;display:flex;flex-direction:column;gap:7px}
.hold .thumb{width:100%;aspect-ratio:1/1;background:var(--sunken);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.hold .thumb svg{width:100%;height:100%}
.hold .nm{font-family:var(--arch);font-weight:700;font-size:11.5px;line-height:1.25;text-transform:uppercase;letter-spacing:-0.2px}
.hold .meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);display:flex;justify-content:space-between;gap:6px}
.hold .est-mine{font-family:var(--mono);font-size:10.5px;color:var(--green-deep);font-weight:600}
.hold .acts{display:flex;gap:5px;flex-wrap:wrap}
.empty{font-family:var(--mono);font-size:12px;color:var(--ink-6);padding:12px 0}

/* ── 매입 창 ── */
.window-tag{display:inline-block;font-family:var(--arch);font-weight:900;font-size:11px;letter-spacing:1.5px;
  text-transform:uppercase;background:var(--gold);color:var(--ink);border:2px solid var(--ink);padding:2px 9px;
  transform:rotate(-1.5deg);margin-bottom:12px}
.botlog{margin-top:16px;border-top:2px solid var(--gray);padding-top:12px;font-family:var(--mono);font-size:12px;color:var(--ink-4)}
.botlog div{padding:2px 0}

/* ── 리빌 (reveal-v1.2 이식) ──
   순서: 그림 → 이름·설명 → 낙찰가 → 뜸 → 실가치 카운트업 + 스탬프 → 사유 → 순위표.
   .shown 이 붙는 순간이 전부 타이머로 관리된다. */
.rv-stage{display:grid;grid-template-columns:auto auto;gap:56px;align-items:center;justify-content:center}
.rv-art{width:var(--rv-art);height:var(--rv-art);opacity:0;transition:opacity .12s linear}
.rv-right{display:flex;flex-direction:column;gap:18px;align-items:center}

/* 스탬프. 회전 주인은 이 래퍼다 — renderPixels 에는 tilt 를 넘기지 않는다.
   둘 다 걸면 −9°가 되고, reduced-motion 의 transform:none 이 SVG 내부 transform 에는 닿지 않는다. */
.rv-stamp{width:var(--rv-stamp);height:var(--rv-stamp);display:flex;align-items:center;justify-content:center;
  transform:rotate(-4.5deg);visibility:hidden}
.rv-stamp.on{visibility:visible}
.rv-stamp svg{width:100%;height:100%}

.rv-ledger{width:var(--rv-stamp);border:3px solid var(--ink);background:var(--white);
  box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column}
.rv-ledger > div{padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.rv-paid{border-bottom:3px solid var(--ink);opacity:0;transition:opacity .12s linear}
.rv-worth{opacity:0;transition:opacity .12s linear}
.rv-paid .n{font-size:19px;color:var(--ink-4)}
.rv-worth .n{font-size:34px}
.rv-swing{font-family:var(--mono);font-size:11.5px;letter-spacing:.4px;opacity:0;transition:opacity .12s linear;min-height:1.5em}
.rv-swing.up{color:var(--green-deep)}
.rv-swing.down{color:var(--red)}
.rv-swing.flat{color:var(--ink-4)}

.rv-info{margin-top:20px;opacity:0;transition:opacity .12s linear}
.rv-reason{margin-top:18px;border-top:3px solid var(--ink);padding-top:14px;
  display:flex;gap:12px;align-items:flex-start;opacity:0;transition:opacity .12s linear}
.rv-reason .hat{flex:0 0 auto;width:22px;height:22px;margin-top:2px}
.rv-reason .v{font-size:14px;line-height:1.6}
.shown{opacity:1}

tr.bump td{background:var(--green);color:var(--paper)}
tr.bump .delta{color:var(--paper)}
.delta{font-size:11px;color:var(--green-deep)}
.delta.down{color:var(--red)}
.rankmove{font-size:10px;color:var(--ink-6);margin-left:5px}
.rv-acts{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}

/* ── 클로징: 하우스의 몫 ──
   경기 내내 어디에도 없던 숫자다. 종이 위가 아니라 먹지 위에 올린다 —
   여기서 처음이자 마지막으로 한 번, 하우스가 제 이름으로 나선다. */
.house{margin-top:26px;border:3px solid var(--ink);background:var(--ink);color:var(--paper);
  box-shadow:6px 6px 0 var(--green-deep);padding:22px 24px}
.house[hidden]{display:none}
.house-head{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--ink-4);padding-bottom:14px}
.house-head .ico{flex:0 0 auto;width:26px;height:26px;display:flex}
.house-head .ico svg{width:100%;height:100%}
.house-head .nm{font-family:var(--arch);font-weight:900;font-size:15px;letter-spacing:2px;text-transform:uppercase}
.cut-row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;
  border-bottom:1px solid #3A3A36;opacity:0;transition:opacity .14s linear}
.cut-row .nm{display:flex;flex-direction:column;gap:3px;min-width:0;
  font-family:var(--arch);font-weight:700;font-size:13.5px;letter-spacing:.3px}
.cut-row .nm em{font-style:normal;font-family:var(--mono);font-size:10.5px;letter-spacing:.2px;
  color:var(--ink-6);font-weight:400;text-transform:none}
.cut-row .n{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.house-total{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-top:18px;
  opacity:0;transition:opacity .14s linear}
.house-total .nm{font-family:var(--arch);font-weight:900;font-size:13px;letter-spacing:2px;
  text-transform:uppercase;color:var(--green)}
.house-total .n{font-family:var(--arch);font-weight:900;font-size:38px;letter-spacing:-1.5px;
  font-variant-numeric:tabular-nums;color:var(--green);white-space:nowrap}
.house-vs{margin-top:16px;border-top:2px solid var(--ink-4);padding-top:14px;
  font-size:13.5px;line-height:1.65;color:#D8D8D2;opacity:0;transition:opacity .14s linear}
/* 공용 .shown 이 이 블록보다 위에 있다. 특정도가 같으니 그대로 두면 여기 opacity:0 이 이긴다. */
.cut-row.shown,.house-total.shown,.house-vs.shown{opacity:1}

/* ── 전적 패널 ──
   화면(.screen) 바깥에 있어 언제나 아래에 깔려 있다. 사이트의 다른 두 게임과 같은 자리다.
   여기 실리는 것은 끝난 판의 숫자뿐 — 지금 굴러가는 판에 대해서는 한 글자도 말하지 않는다. */
.record{margin-top:48px;border:3px solid var(--ink);background:#fff;box-shadow:6px 6px 0 var(--ink);padding:20px 22px}
.record h2{font-family:var(--arch);font-weight:900;font-size:15px;letter-spacing:2px;text-transform:uppercase;
  border-bottom:3px solid var(--ink);padding-bottom:8px;margin:0 0 14px}
.record .rec-note{font-family:var(--mono);font-size:12px;color:var(--ink-4);line-height:1.7;margin:0}
.record .rec-scroll{overflow-x:auto}
.record table{border-collapse:collapse;width:100%;min-width:480px;font-family:var(--mono);font-size:12px}
.record th,.record td{border-bottom:1px solid var(--gray);padding:7px 8px;text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.record th{font-family:var(--arch);font-size:11px;letter-spacing:1px;text-transform:uppercase;
  border-bottom:3px solid var(--ink);background:var(--sunken)}
.record th:first-child,.record td:first-child{text-align:left}
.record td:first-child{font-family:var(--arch);font-weight:700;font-size:11.5px;letter-spacing:1px;text-transform:uppercase}
.record .first{color:var(--green-deep);font-weight:700}
.record .rate{font-weight:700}
.record tr.tot td{background:var(--sunken);border-top:3px solid var(--ink);border-bottom:none;font-weight:700}

(function(){
  var els=[].slice.call(document.querySelectorAll('.tx'));
  function paint(lang){
    els.forEach(function(el){ var t=el.dataset[lang]; if(t!==undefined) el.innerHTML=t; });
    var btns=document.querySelectorAll('#langtoggle button');
    for(var i=0;i<btns.length;i++){ btns[i].classList.toggle('on', btns[i].dataset.lang===lang); }
  }
  function setLang(lang){
    if(lang===window.APP_LANG) return;
    window.APP_LANG=lang;
    document.documentElement.lang=(lang==='kr'?'ko':'en');
    try{ localStorage.setItem('kyg_lang', lang); }catch(e){}
    paint(lang);
    window.APP_LANG_LISTENERS.forEach(function(fn){ try{ fn(lang); }catch(e){ console.error(e); } });
  }
  paint(window.KYG_LANG||'en');
  document.documentElement.classList.remove('lang-pending');
  document.getElementById('langtoggle').addEventListener('click', function(e){
    var b=e.target.closest('button'); if(b) setLang(b.dataset.lang);
  });
})();
</script>

/* ── 픽셀 렌더러 하나로 통일 (인수인계 §5) ──
   스프라이트·아이콘·스탬프가 전부 이 함수를 쓴다. 격자는 문자열 배열,
   팔레트는 문자 → 색. 회전은 옵션이며 기본은 걸지 않는다. */
var PX = {'0':'transparent','1':'#DDDDD8','2':'#B5B5B0','3':'#4A4A46','4':'#141414','5':'#2BB673','6':'#F6F6F4'};
function renderPixels(rows, palette, opts){
  opts = opts || {};
  var size = rows.length, scale = opts.scale || 5, tilt = opts.tilt || 0;
  var out = [];
  for (var y=0; y<size; y++){
    var row = rows[y], x = 0;
    while (x < row.length){
      var v = row.charAt(x), fill = palette[v];
      if (!fill || fill === 'transparent'){ x++; continue; }
      var run = 1;
      while (row.charAt(x+run) === v) run++;
      out.push('<rect x="'+x+'" y="'+y+'" width="'+run+'" height="1" fill="'+fill+'"/>');
      x += run;
    }
  }
  var g = tilt ? '<g transform="rotate('+tilt+' '+(size/2)+' '+(size/2)+')">'+out.join('')+'</g>' : out.join('');
  return '<svg width="'+(size*scale)+'" height="'+(size*scale)+'" viewBox="0 0 '+size+' '+size+
         '" shape-rendering="crispEdges" style="image-rendering:pixelated;display:block" aria-hidden="true">'+g+'</svg>';
}
function icon(id, scale, color){
  var pal = PX;
  if (color){ pal = {}; for (var k in PX) pal[k] = (PX[k]==='transparent'?'transparent':color); }
  return renderPixels(ICONS[id], pal, {scale: scale||1});
}
/* 스탬프는 팔레트가 따로다 (0 투명 / 1 잉크 / 2 번진 가장자리). 회전은 .rv-stamp 래퍼가 건다. */
var STAMP_PAL = {
  genuine: {'0':'transparent','1':'#2BB673','2':'#0F6E56'},
  fake:    {'0':'transparent','1':'#141414','2':'#4A4A46'},
  passed:  {'0':'transparent','1':'#4A4A46','2':'#B5B5B0'}
};
function stampHTML(kind, lang){
  var g = STAMPS[kind+'_'+lang] || STAMPS[kind+'_en'];
  return renderPixels(g, STAMP_PAL[kind], {scale: 232/48});
}

/* ── 경량 RNG (mulberry32). 검증용 MT19937 과 인터페이스가 같다. ── */
function FastRandom(seed){ this.s = (seed>>>0) || 1; this.gaussNext = null; }
FastRandom.prototype._u32 = function(){
  this.s = (this.s + 0x6D2B79F5) >>> 0;
  var t = this.s;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return (t ^ (t >>> 14)) >>> 0;
};
FastRandom.prototype.random = function(){
  var hi = this._u32() >>> 5, lo = this._u32() >>> 6;
  return (hi * 67108864.0 + lo) * (1.0 / 9007199254740992.0);
};
FastRandom.prototype.below = function(n){ return Math.floor(this.random()*n); };
FastRandom.prototype.choice = function(a){ return a[this.below(a.length)]; };
FastRandom.prototype.uniform = function(a,b){ return a + (b-a)*this.random(); };
FastRandom.prototype.gauss = function(mu, sigma){
  var z = this.gaussNext; this.gaussNext = null;
  if (z === null){
    var x2pi = this.random()*2*Math.PI;
    var g2rad = Math.sqrt(-2.0*Math.log(1.0 - this.random()));
    z = Math.cos(x2pi)*g2rad;
    this.gaussNext = Math.sin(x2pi)*g2rad;
  }
  return mu + z*sigma;
};

/* ── 룰북 확정 상수 (엔진 v7 1:1) ── */
var BUDGET = 1000.0;
var N_ITEMS = 20;
var POOL_RATIO = 1.30;
var SIT_FEE = 0.15;
var APPR_FEE = 10.0;
var BUYBACK_RATE = 0.58;
var BUYBACK_ROUNDS = {5:1, 10:1, 15:1};

var FAKE_RATE = 0.35;
var FAKE_MED = 15.0, FAKE_SD = 0.7;
/* v9 위작 쪼개기. v8 까지 위작은 그냥 '싼 물건'이었다 — 공개 감정가가 실가치에서
   나오니 위작(중앙값 £15M)과 진품(£261M)이 겹치지 않았고, 3000판에서 겹침이
   0.2% 였다. 이름만 위작이지 아무 일도 하지 않았다는 뜻이다.
   이제 위작의 절반 남짓은 진품의 옷을 입는다: 공개 감정가를 '진품이었다면'
   값에서 뽑고, 실가치는 그대로 £15M 근처에 둔다. */
var DISGUISE_RATE = 0.55;       // 위작 중 옷 입은 비율 (= 전체 출품의 19%)
var FOOL_RATE = 0.12;           // 옷 입은 위작 중 정밀 감정까지 속이는 비율
/* 옷을 입히면 공개 감정가는 더 이상 값어치의 정직한 추정치가 아니다. 감정 없이
   보는 눈은 그만큼 깎아서 봐야 한다 — 안 깎으면 승자의 저주가 터진다. */
var SHADE = 0.68;
var GEN_SD = 0.9;
var EPS_SD = 0.30;
var TAIL_P = 0.05, TAIL_SD = 0.80;
var K_CHOICES = [1.5, 2.0, 2.5];
var PRECISE_SD = 0.18;          // v8. 정밀 감정은 답이 아니라 좁은 폭이다
var BAND_Z = 1.645;             // 9/10 구간. 폭 = est × exp(±Z·sd)
var START_LO = 0.10, START_HI = 0.30;
var PACE_LO = 0.55, PACE_HI = 1.60;
var POOL_TARGET = BUDGET * 4 * POOL_RATIO;

/* v8 줍기 방지 (findings v8). 봇이 예산을 다 태우고 나면 후반 물건이 시작가에
   떨어졌다. 두 개를 건다 — 끝까지 남기는 입찰용 잔돈, 그리고 헐값 줍기.
   v9 정정: v8 의 잔돈은 'cash − reserve' 로 걸려 있어서 끝까지 못 쓰는 돈이었다.
   후반에 부르라고 만든 돈이 후반에도 잠겨 있었던 것이다. 이제 라운드가 줄면
   같이 풀리고, 푸는 양을 성격(pace)에 비례시킨다 — RECKLESS 는 애초에 안 아끼고
   SHARK 는 크게 아꼈다가 끝에 쏟는다. 그래야 티어 곡선이 납작해지지 않는다. */
var RESERVE_FLOOR = 0.02;       // 끝까지 잠그는 최소 잔돈
var RESERVE_PACE  = 0.55;       // pace 에 비례해 후반으로 갈수록 풀리는 몫
var BARGAIN_EDGE = 4.0;         // 값어치가 시작가의 4배를 넘으면 헐값으로 본다
var SNIPE_LO = 1.00, SNIPE_HI = 1.15;
/* 감정료는 물건 크기에 비하면 정액이다. £10M 은 £800M 짜리 앞에서 거의 공짜고
   £20M 짜리 앞에서는 비싸다. 봇도 그걸 보고 감정을 산다. */
var SIZE_REF = 250, SIZE_POW = 0.5, SIZE_LO = 0.5, SIZE_HI = 1.8;

/*            acc   risk  appr  pace  snipe */
var CARDS = {
  RECKLESS: [0.35, 0.98, 0.35, 0.00, 0.02],
  EAGER:    [0.30, 0.90, 0.50, 0.20, 0.20],
  STEADY:   [0.22, 0.92, 0.55, 0.45, 0.60],
  CAREFUL:  [0.16, 0.82, 0.70, 0.65, 0.90],
  SHARK:    [0.11, 0.64, 0.85, 0.85, 0.98]
};
var TIERS = {
  EASY:   [['RECKLESS','RECKLESS','EAGER'],['RECKLESS','EAGER','EAGER'],['RECKLESS','RECKLESS','STEADY']],
  NORMAL: [['RECKLESS','RECKLESS','STEADY'],['RECKLESS','EAGER','STEADY'],['RECKLESS','EAGER','EAGER']],
  HARD:   [['EAGER','STEADY','CAREFUL'],['STEADY','STEADY','CAREFUL'],['EAGER','CAREFUL','CAREFUL']],
  BRUTAL: [['CAREFUL','CAREFUL','SHARK'],['CAREFUL','SHARK','SHARK'],['SHARK','SHARK','SHARK']]
};
var TIER_ORDER = ['EASY','NORMAL','HARD','BRUTAL'];

/* ── 생성 ── */
function genItems(rng){
  var evTarget = POOL_TARGET / N_ITEMS;
  var evFake = FAKE_MED * Math.exp((FAKE_SD*FAKE_SD)/2);
  var genMed = (evTarget - FAKE_RATE*evFake) / ((1-FAKE_RATE) * Math.exp((GEN_SD*GEN_SD)/2));
  var items = [];
  for (var i=0; i<N_ITEMS; i++){
    var fake = rng.random() < FAKE_RATE;
    var v = fake ? FAKE_MED * Math.exp(rng.gauss(0, FAKE_SD))
                 : genMed  * Math.exp(rng.gauss(0, GEN_SD));
    var sd = rng.random() < TAIL_P ? TAIL_SD : EPS_SD;
    /* 난수 뽑는 순서는 위작 여부와 무관하게 고정한다 — 조건부로 뽑으면 같은 시드가 갈린다. */
    var disguised = fake && rng.random() < DISGUISE_RATE;
    var fools = rng.random() < FOOL_RATE;
    var shadow = genMed * Math.exp(rng.gauss(0, GEN_SD));   // '진품이었다면' 값어치
    var shown = disguised ? shadow : v;
    var c = shown * Math.exp(rng.gauss(0, sd));   // 빗나간 중심 (옷 입은 위작은 옷에서 나온다)
    var cHouse = v * Math.exp(rng.gauss(0, sd));  // 하우스가 자기 눈으로 본 중심 (항상 뽑는다)
    var k = rng.choice(K_CHOICES);
    var lo = c/k, hi = c*k;
    var start = lo * rng.uniform(START_LO, START_HI);   // 실가치는 입력이 아니다
    items.push({
      idx:i, value:v, fake:fake, lo:lo, hi:hi, start:start,
      gm: Math.sqrt(lo*hi), owner:-1, paid:0.0,
      disguised: disguised,                 // 진품의 옷을 입었나
      foolsAppr: disguised && fools,        // 정밀 감정까지 속이나 (정교한 위작)
      shadowValue: shadow,                  // '진품이었다면' 값어치
      houseGm: disguised ? cHouse : c,      // 하우스 매입가는 이걸 쓴다 — 하우스는 옷에 안 속는다
      appraisedByOwner:false, preciseEst:0.0, soldToHouse:false, lot:null
    });
  }
  return items;
}

/* 소진 압박. 양방향이다 — 단방향으로 구현하면 봇이 후반에 자멸한다 (findings v6 §3-1). */
function paceFactor(bot, rd){
  if (bot.pace <= 0) return 1.0;
  var roundsLeft = N_ITEMS - rd + 1;
  var onPace = BUDGET * roundsLeft / N_ITEMS;
  var ratio = bot.cash / Math.max(onPace, 1.0);
  return Math.min(PACE_HI, Math.max(PACE_LO, Math.pow(ratio, bot.pace)));
}
/* 감정 없이 보는 눈. 옷 입은 위작이 섞여 있으므로 공개 중심값을 SHADE 만큼 깎는다. */
function perceived(bot, item, rng){ return item.gm * Math.exp(rng.gauss(0, bot.acc)) * SHADE; }

/* 정밀 감정이 보는 값. 정교한 위작은 '진품이었다면' 값을 돌려준다 —
   감정이 몰래 틀리는 게 아니라, 물건이 감정을 속이는 것이다. */
function apprBase(item){ return item.foolsAppr ? item.shadowValue : item.value; }

/* 감정료 £10M 이 물건 크기에 비해 싼지 비싼지. 큰 물건일수록 봇이 확인한다. */
function sizeFactor(item){
  return Math.min(SIZE_HI, Math.max(SIZE_LO, Math.pow(item.gm / SIZE_REF, SIZE_POW)));
}

/* 봇이 들고 있어야 하는 입찰용 잔돈. 사람 자리에는 걸지 않는다.
   끝까지 잠그는 몫 + 라운드가 남은 만큼 아끼는 몫(성격 비례). */
function reserveAt(bot, rd){
  if (bot.isUser) return 0;
  return RESERVE_FLOOR * BUDGET +
         RESERVE_PACE * bot.pace * BUDGET * Math.max(0, N_ITEMS - rd) / N_ITEMS;
}

function buyAppraisal(bot, item, rng){
  var wide = item.hi/item.lo >= 3.0;
  var p = bot.apprProb * (wide ? 1.4 : 0.8) * sizeFactor(item);
  if (bot.cash > APPR_FEE + item.start && rng.random() < p){
    bot.cash -= APPR_FEE; bot.apprCount += 1; bot.feesPaid += APPR_FEE;
    return apprBase(item) * Math.exp(rng.gauss(0, PRECISE_SD));
  }
  return null;
}

   부호를 파운드 기호 뒤에 두면 '£-17M' 처럼 읽히므로 앞으로 뺀다. */
var money = function(n){
  var r = Math.round(n);
  return (r < 0 ? '−£' : '£') + Math.abs(r).toLocaleString('en-GB') + 'M';
};
var esc = function(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };

/* v8 — 정밀 감정은 답이 아니라 좁은 폭이다.
   감정가 est 를 받았을 때 실가치가 열 번에 아홉 번 들어오는 구간 = est × exp(±Z·sd).
   숫자 하나를 주면 그 위로는 아무도 부르지 않게 되고, 그래서 봇이 늘 손해를 본다. */
var bandOf = function(est){
  var f = Math.exp(BAND_Z * PRECISE_SD);
  return [est / f, est * f];
};
/* 정밀 감정의 소견. 폭만 봐도 읽히지만 (£15M 짜리 폭이 £300M 짜리 창 밑에
   붙어 있으면 그게 답이다) 한 줄로 적어 준다. 정교한 위작 앞에서는 감정이
   '진품' 이라고 말한다 — 감정이 틀린 게 아니라 물건이 감정을 속인 것이다. */
var apprVerdict = function(item){ return item.foolsAppr ? false : item.fake; };
var verdictHTML = function(item){
  var isFake = apprVerdict(item);
  return '<span class="appr-verdict' + (isFake ? ' fake' : '') + '">'
    + esc(t(isFake ? 'vdFake' : 'vdGenuine')) + '</span>';
};

var bandText = function(est){
  var b = bandOf(est);
  return money(b[0]) + ' – ' + money(b[1]);
};

  if (vars) for (var v in vars) s = s.split('{'+v+'}').join(vars[v]);

/* 피로스 대사. 한 세션 안에서 같은 문구를 반복하지 않는다.
   언어를 바꿔도 같은 자리의 문구가 바뀌면 안 되므로, 화면에 떠 있는 대사는
   그룹 이름이 아니라 확정된 선택(그룹 + 인덱스)을 들고 있는다. */
function linePool(group){
  return group.indexOf('.') > 0
    ? group.split('.').reduce(function(o,k){ return o[k]; }, LINES)
    : LINES[group].variants;
}
function fixSay(group, vars){
  var pool = linePool(group);
  var used = said[group] || (said[group] = []);
  if (used.length >= pool.length) used.length = 0;
  var pick, guard = 0;
  do { pick = G ? G.rng.below(pool.length) : Math.floor(Math.random()*pool.length); guard++; }
  while (used.indexOf(pick) >= 0 && guard < 40);
  used.push(pick);
  return {group: group, i: pick, vars: vars || {}};
}
function renderSay(ref){
  if (!ref) return '';
  var s = linePool(ref.group)[ref.i][LANG];
  for (var v in ref.vars) s = s.split('{'+v+'}').join(ref.vars[v](LANG));
  return s;
}
function seatName(p){ return p.label[LANG]; }
function lotName(item){ return item.lot.name[LANG]; }

/* ============================================================
   판 만들기
   ============================================================ */
function shuffled(arr, rng){
  var a = arr.slice();
  for (var i=a.length-1; i>0; i--){ var j = rng.below(i+1); var tmp=a[i]; a[i]=a[j]; a[j]=tmp; }
  return a;
}
/* 별명 3개는 서로 6 이상 떨어지게 뽑는다. 간격이 좁으면 순위표에서 헷갈린다 (인수인계 §5). */
function pickNumbers(rng){
  for (var attempt=0; attempt<200; attempt++){
    var pick = shuffled(BOTPOOL, rng).slice(0,3);
    var ok = true;
    for (var i=0;i<3;i++) for (var j=i+1;j<3;j++)
      if (Math.abs(pick[i].no - pick[j].no) < 6) ok = false;
    if (ok) return pick;
  }
  return [BOTPOOL[0], BOTPOOL[6], BOTPOOL[12]];   // 6 / 41 / 77 — 안전한 대체
}

function newGame(tier){
  var seed = (Date.now() ^ Math.floor(Math.random()*0xffffffff)) >>> 0;
  var rng = new FastRandom(seed);
  said = {};

  var items = genItems(rng);
  var lots = shuffled(LOTS, rng).slice(0, N_ITEMS);
  for (var i=0;i<N_ITEMS;i++) items[i].lot = lots[i];

  /* 조합을 뽑고 좌석 순서를 다시 섞는다 — 좌석 번호가 성격을 암시하면 안 된다. */
  var combo = shuffled(rng.choice(TIERS[tier]), rng);
  var nums = pickNumbers(rng);

  var players = [{
    isUser:true, label:USER_LABEL, badge:'',
    cash:BUDGET, items:[], apprCount:0, feesPaid:0,
    acc:0, risk:0, apprProb:0, pace:0, snipe:0, card:null
  }];
  for (var s=0; s<3; s++){
    var c = CARDS[combo[s]];
    players.push({
      isUser:false, label:{kr:nums[s].kr, en:nums[s].en}, badge:String(nums[s].no),
      cash:BUDGET, items:[], apprCount:0, feesPaid:0,
      acc:c[0], risk:c[1], apprProb:c[2], pace:c[3], snipe:c[4], card:combo[s]
    });
  }

  G = {
    seed:seed, rng:rng, tier:tier, items:items, players:players,
    gameId:uuid4(), logged:false,
    round:0, house:{fees:0, buyback:0, unsold:0},
    pre:null, userEst:null, userBid:null, result:null,
    bbSoldByUser:false, bbLog:[], bbRound:0,
    lotIntroAt:0, sayRef:null, unsold:0
  };
  beginRound();
}

/* ── 라운드 시작 ── */
function beginRound(){
  G.round += 1;
  var item = G.items[G.round-1];
  G.pre = {};
  G.userEst = null;
  G.userBid = null;
  G.result = null;

  /* 사전 감정으로 봇의 잔액이 움직이기 전 상태를 떠 둔다. 입찰 화면 좌석표가 이걸 쓴다. */
  G.snap = G.players.map(function(p){ return {cash: p.cash, appr: p.apprCount}; });

  /* 봇의 사전 정밀 감정. 결과는 라운드가 끝날 때까지 공개하지 않는다. */
  for (var i=1;i<4;i++){
    var est = buyAppraisal(G.players[i], item, G.rng);
    if (est !== null){ G.pre[i] = est; G.house.fees += APPR_FEE; }
  }

  /* lotIntro 는 3~4점마다 한 번. 스무 점 전부에 대사를 붙이지 않는다. */
  if (G.round === 1 || G.round - G.lotIntroAt >= 3 + G.rng.below(2)){
    G.lotIntroAt = G.round;
    G.sayRef = fixSay('lotIntro', {
      lot: function(L){ return item.lot.name[L]; },
      amount: function(){ return money(item.start); }
    });
  } else {
    G.sayRef = null;
  }

  show('round');
  renderRound();
}

/* ── 입찰 마감 ── */
function resolveRound(userBid){
  var item = G.items[G.round-1];
  var bids = [];
  if (userBid !== null && userBid >= item.start) bids.push([userBid, 0]);

  for (var i=1;i<4;i++){
    var b = G.players[i];
    var est = (G.pre[i] !== undefined) ? G.pre[i] : perceived(b, item, G.rng);
    var ceiling = b.risk * est / (1 - SIT_FEE);
    var bid = Math.min(b.cash, paceFactor(b, G.round) * ceiling * G.rng.uniform(0.97, 1.03));
    bid = Math.min(bid, Math.max(0, b.cash - reserveAt(b, G.round)));
    /* 헐값 줍기 — 페이스보다 우선한다. 눈앞의 £10M 짜리 £100M 은 줍는 게 맞다.
       알아채는 확률은 성격마다 다르다: 막 지르는 쪽은 거의 못 보고, 여우는 놓치지 않는다. */
    if (b.snipe > 0 && est > item.start * BARGAIN_EDGE &&
        b.cash >= item.start && G.rng.random() < b.snipe){
      bid = Math.max(bid, Math.min(b.cash, item.start * G.rng.uniform(SNIPE_LO, SNIPE_HI)));
    }
    if (bid >= item.start && bid <= b.cash) bids.push([bid, i]);
  }

  if (bids.length){
    bids.sort(function(x,y){ return (y[0]-x[0]) || (y[1]-x[1]); });   // 동점이면 좌석 번호가 큰 쪽
    var price = bids[0][0], w = bids[0][1];
    item.owner = w; item.paid = price;
    G.players[w].cash -= price;
    G.players[w].items.push(item);
    if (w === 0 && G.userEst !== null){ item.appraisedByOwner = true; item.preciseEst = G.userEst; }
    if (w !== 0 && G.pre[w] !== undefined){ item.appraisedByOwner = true; item.preciseEst = G.pre[w]; }
    G.result = {winner:w, price:price};
    G.sayRef = fixSay('hammer', {
      name: function(L){ return G.players[w].label[L]; },
      amount: function(){ return money(price); }
    });
  } else {
    G.unsold += 1;
    G.house.unsold += item.value;
    G.result = {winner:-1, price:0};
    G.sayRef = fixSay('passed');
  }

  /* 감정 사실 공개 — 낙찰 확정 후에만 (룰북 §5, findings v5) */
  var names = [];
  if (G.userEst !== null) names.push(0);
  for (var k in G.pre) names.push(Number(k));
  names.sort(function(a,b){ return a-b; });
  G.result.appraisers = names;

  show('result');
  renderResult();
}

/* ── 라운드 뒤 처리 ── */
function afterResult(){
  if (BUYBACK_ROUNDS[G.round]) { openBuyback(); return; }
  if (G.round >= N_ITEMS) { startReveal(); return; }
  beginRound();
}

/* ============================================================
   하우스 매입 창 (5·10·15 라운드 뒤)
   ============================================================ */
function openBuyback(){
  G.bbRound = G.round;
  G.bbSoldByUser = false;
  G.bbLog = [];

  /* 사후 정밀 감정 — 봇은 소유 작품을 스스로 다시 본다. */
  for (var i=1;i<4;i++){
    var b = G.players[i];
    for (var j=0;j<b.items.length;j++){
      var it = b.items[j];
      if (it.appraisedByOwner) continue;
      var wide = it.hi/it.lo >= 3.0;
      var p = b.apprProb * (wide ? 1.5 : 0.7) * sizeFactor(it);
      if (b.cash >= APPR_FEE && G.rng.random() < p){
        b.cash -= APPR_FEE; b.apprCount += 1; b.feesPaid += APPR_FEE;
        G.house.fees += APPR_FEE;
        it.appraisedByOwner = true;
        it.preciseEst = apprBase(it) * Math.exp(G.rng.gauss(0, PRECISE_SD));
      }
    }
  }

  /* 봇의 매도 판단. 창당 1인 1점. */
  for (var i2=1;i2<4;i2++){
    var bb = G.players[i2], best = null, bestGain = 0.0;
    for (var m=0;m<bb.items.length;m++){
      var itm = bb.items[m];
      if (!itm.appraisedByOwner) continue;
      var gain = BUYBACK_RATE*itm.houseGm - itm.preciseEst;
      if (gain > bestGain){ best = itm; bestGain = gain; }
    }
    if (best === null) continue;
    var offer = BUYBACK_RATE * best.houseGm;
    bb.items.splice(bb.items.indexOf(best), 1);
    bb.cash += offer;
    best.soldToHouse = true;
    G.house.buyback += best.value - offer;
    G.bbLog.push({seat:i2});
  }

  G.sayRef = fixSay('buybackOpen');
  show('buyback');
  renderBuyback();
}

function userAppraiseOwned(idx){
  var me = G.players[0], it = me.items[idx];
  if (!it || it.appraisedByOwner || me.cash < APPR_FEE) return;
  me.cash -= APPR_FEE; me.apprCount += 1; me.feesPaid += APPR_FEE;
  G.house.fees += APPR_FEE;
  it.appraisedByOwner = true;
  it.preciseEst = apprBase(it) * Math.exp(G.rng.gauss(0, PRECISE_SD));
  renderBuyback();
}
function userSell(idx){
  if (G.bbSoldByUser) return;
  var me = G.players[0], it = me.items[idx];
  if (!it || !it.appraisedByOwner) return;
  var offer = BUYBACK_RATE * it.houseGm;
  me.items.splice(idx, 1);
  me.cash += offer;
  it.soldToHouse = true;
  G.house.buyback += it.value - offer;
  G.bbSoldByUser = true;
  G.bbLog.push({seat:0, lot:it, offer:offer});
  renderBuyback();
}
function closeBuyback(){
  if (G.round >= N_ITEMS) startReveal(); else beginRound();
}

/* ============================================================
   리빌 (룰북 §9)
   한 점씩, 값이 큰 놀라움일수록 뒤로. 순위는 공개할 때마다 다시 매긴다.
   하우스 몫은 이 화면 어디에도 나오지 않는다 — 클로징이 첫 공개다.
   ============================================================ */
var RVT = {ART:0, INFO:240, PAID:520, HOLD:1180, COUNT:700, TICK:40,
           STAMP:60, SWING:140, REASON:2050, BOARD:2380, BUMP:800};
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 공개 순서용 "놀라움". 정의는 세 경우 모두 같다 — 치른 값과 실제의 차이.
   유찰품은 아무도 값을 치르지 않았으므로 실가치 전체가 그대로 괴리다. */
function surprise(it){
  if (it.owner < 0) return it.value;
  if (it.soldToHouse) return Math.abs(it.value - BUYBACK_RATE * it.houseGm);
  return Math.abs(it.value - it.paid);
}
function heldBy(it){ return (it.owner >= 0 && !it.soldToHouse) ? it.owner : -1; }

function startReveal(){
  var order = G.items.slice().sort(function(a,b){
    return (surprise(a) - surprise(b)) || (a.idx - b.idx);
  });
  G.reveal = {order:order, i:-1, timers:[], settled:false};
  show('reveal');
  rvGoto(0);
}

function rvClear(){
  if (!G.reveal) return;
  G.reveal.timers.forEach(function(c){ c(); });
  G.reveal.timers = [];
}
function rvAt(ms, fn){
  var h = setTimeout(fn, ms);
  G.reveal.timers.push(function(){ clearTimeout(h); });
}
function rvCurrent(){ return G.reveal.order[G.reveal.i]; }
function rvKind(it){ return it.owner < 0 ? 'passed' : (it.fake ? 'fake' : 'genuine'); }

/* n점까지 공개했을 때의 자산. 잔액은 처음부터 확정이고, 값이 드러난 소장품만 더해진다.
   20점을 다 공개하면 endGame 의 최종 점수와 정확히 같아진다. */
function rvEquity(upTo){
  var eq = G.players.map(function(p){ return (1-SIT_FEE) * p.cash; });
  var lots = [0,0,0,0];
  for (var k=0; k<upTo; k++){
    var it = G.reveal.order[k], h = heldBy(it);
    if (h >= 0){ eq[h] += it.value; lots[h] += 1; }
  }
  return {eq:eq, lots:lots};
}
function rvRank(eq){
  var idx = [0,1,2,3].slice();
  idx.sort(function(a,b){ return (eq[b]-eq[a]) || (a-b); });
  var rank = [0,0,0,0];
  idx.forEach(function(seat, i){ rank[seat] = i+1; });
  return {order:idx, rank:rank};
}

function rvGoto(i){
  var R = G.reveal;
  R.i = i;
  var it = rvCurrent();
  if (i === 0){
    G.sayRef = fixSay('revealOpen');
  } else if (it.owner < 0){
    G.sayRef = fixSay('revealUnsold');
  } else {
    G.sayRef = fixSay('revealItem', {
      lot:    function(L){ return it.lot.name[L]; },
      name:   function(L){ return G.players[it.owner].label[L]; },
      amount: function(){ return money(it.paid); }
    });
  }
  renderReveal();
}

/* 정적인 부분을 전부 다시 칠하고, 애니메이션은 처음부터 다시 돌린다.
   언어 전환도 이 경로를 탄다 — 이미 끝난 로트면 최종 상태로 바로 앉힌다. */
function renderReveal(){
  var R = G.reveal, it = rvCurrent(), passed = (it.owner < 0);
  rvClear();

  $('rv-lot').textContent = t('revealTag') + ' — ' + t('lot') + ' '
    + String(R.i+1).padStart(2,'0') + ' / ' + N_ITEMS;
  $('rv-stats').innerHTML = hudHTML();
  sayInto('rv-say','rv-hat','rv-line');

  $('rv-art').innerHTML = renderPixels(SPRITES[it.lot.slug], PX, {scale:14});
  $('rv-tag').textContent = t('lot') + ' ' + String(R.i+1).padStart(2,'0') + ' · ' + it.lot.category.toUpperCase();
  $('rv-name').textContent = it.lot.name[LANG];
  $('rv-desc').textContent = it.lot.desc[LANG];

  $('rv-paid-label').textContent = passed ? t('unsoldPaid') : t('hammer');
  $('rv-paid-value').textContent = passed ? '—' : money(it.paid);
  $('rv-worth-label').textContent = t('trueValue');
  $('rv-stamp').innerHTML = stampHTML(rvKind(it), LANG);
  $('rv-reason-hat').innerHTML = icon('pyrrhos', 22/24);
  $('rv-reason-line').textContent = (it.fake ? it.lot.debunked : it.lot.vindicated)[LANG];

  $('btn-rv-next').textContent = (R.i + 1 >= N_ITEMS) ? t('toEnd') : t('next');
  $('btn-rv-skip').textContent = t('rvSkip');

  if (R.settled){ rvSettle(); return; }

  ['rv-art','rv-info','rv-paid','rv-worth','rv-reason'].forEach(function(id){ $(id).classList.remove('shown'); });
  $('rv-stamp').classList.remove('on');
  $('rv-swing').className = 'rv-swing';
  $('rv-swing').textContent = '';
  $('rv-worth-value').textContent = money(0);
  rvBoard(false);

  if (REDUCED){ rvSettle(); return; }

  rvAt(RVT.ART,  function(){ $('rv-art').classList.add('shown'); });
  rvAt(RVT.INFO, function(){ $('rv-info').classList.add('shown'); });
  rvAt(RVT.PAID, function(){ $('rv-paid').classList.add('shown'); });
  /* RVT.PAID ~ RVT.HOLD 는 뜸이다. 의도적으로 비어 있다. */
  rvAt(RVT.HOLD, function(){ $('rv-worth').classList.add('shown'); rvCountUp(it.value); });
  rvAt(RVT.HOLD + RVT.STAMP, function(){ $('rv-stamp').classList.add('on'); });
  rvAt(RVT.HOLD + RVT.COUNT + RVT.SWING, rvSwing);
  rvAt(RVT.REASON, function(){ $('rv-reason').classList.add('shown'); });
  rvAt(RVT.BOARD, function(){ rvBoard(true); G.reveal.settled = true; });
}

/* 0에서 target 까지 dur 동안 굴린다. 멈추는 방법은 호출한 쪽이 보관한다 —
   리빌과 클로징이 각자 자기 타이머 목록을 들고 있기 때문이다. */
function countUp(el, target, dur, tick, keep){
  var steps = Math.max(1, Math.round(dur / tick)), n = 0;
  var h = setInterval(function(){
    n++;
    el.textContent = money(target * (n/steps));
    if (n >= steps){ clearInterval(h); el.textContent = money(target); }
  }, tick);
  keep(function(){ clearInterval(h); });
}
function rvCountUp(target){
  countUp($('rv-worth-value'), target, RVT.COUNT, RVT.TICK, function(c){ G.reveal.timers.push(c); });
}

/* 손익 한 줄. 유찰이면 금액 귀속을 쓰지 않는다 — 실가치는 위에서 이미 공개됐고,
   그 값이 누구에게 갔는지는 클로징에서 처음 드러나야 한다 (룰북 §9). */
function rvSwing(){
  var it = rvCurrent(), el = $('rv-swing');
  if (it.owner < 0){ el.className = 'rv-swing flat shown'; el.textContent = t('noBid'); return; }
  if (it.soldToHouse){ el.className = 'rv-swing flat shown'; el.textContent = t('toHouse'); return; }
  var d = it.value - it.paid;
  el.className = 'rv-swing shown ' + (d >= 0 ? 'up' : 'down');
  el.textContent = (d >= 0 ? '+' : '−') + money(Math.abs(d)) + ' · ' + (d >= 0 ? t('gain') : t('loss'));
}

/* 순위표. applyDelta 면 이번 로트를 반영한 뒤 자산 기준으로 다시 정렬하고 변동을 표시한다. */
function rvBoard(applyDelta){
  var R = G.reveal;
  var before = rvEquity(R.i), after = rvEquity(R.i + (applyDelta ? 1 : 0));
  var rBefore = rvRank(before.eq), rAfter = rvRank(after.eq);

  var head = '<div class="bh"><span>'+t('standings')+'</span><span>'
    + t('lot')+' '+String(R.i+1).padStart(2,'0')+' / '+N_ITEMS+'</span></div>';
  var body = rAfter.order.map(function(seat, i){
    var p = G.players[seat], rank = i+1, d = after.eq[seat] - before.eq[seat];
    var badge = p.isUser ? '' : '<span class="seat-badge">'+p.badge+'</span>';
    var moved = applyDelta && rank !== rBefore.rank[seat];
    var arrow = moved ? '<span class="rankmove">'+(rank < rBefore.rank[seat] ? '▲' : '▼')+'</span>' : '';
    var delta = Math.round(d) === 0
      ? '<span class="delta">—</span>'
      : '<span class="delta'+(d < 0 ? ' down' : '')+'">'+(d > 0 ? '+' : '−')+money(Math.abs(d))+'</span>';
    return '<tr class="'+(p.isUser?'you':'')+(Math.round(d) !== 0 ? ' bump' : '')+'">'
      + '<td>'+rank+arrow+'</td>'
      + '<td>'+badge+esc(seatName(p))+'</td>'
      + '<td class="num">'+after.lots[seat]+'</td>'
      + '<td class="num">'+money(after.eq[seat])+'</td>'
      + '<td class="num">'+delta+'</td></tr>';
  }).join('');
  $('rv-board').innerHTML = head + '<table><thead><tr><th>#</th><th>'+t('player')+'</th>'
    + '<th class="num">'+t('held')+'</th><th class="num">'+t('equity')+'</th>'
    + '<th class="num">Δ</th></tr></thead><tbody>'+body+'</tbody></table>';

  if (applyDelta){
    rvAt(RVT.BUMP, function(){
      [].slice.call($('rv-board').querySelectorAll('tr.bump')).forEach(function(tr){ tr.classList.remove('bump'); });
    });
  }
}

/* 연출 중간에 [다음]을 누르면 먼저 이 상태로 건너뛴다. */
function rvSettle(){
  rvClear();
  var it = rvCurrent();
  ['rv-art','rv-info','rv-paid','rv-worth','rv-reason'].forEach(function(id){ $(id).classList.add('shown'); });
  $('rv-stamp').classList.add('on');
  $('rv-worth-value').textContent = money(it.value);
  rvSwing();
  rvBoard(true);
  G.reveal.settled = true;
}

function rvAdvance(){
  if (!G.reveal.settled){ rvSettle(); return; }
  if (G.reveal.i + 1 >= N_ITEMS){ endGame(); return; }
  G.reveal.settled = false;
  rvGoto(G.reveal.i + 1);
}
function rvSkipAll(){ rvClear(); endGame(); }

/* ============================================================
   클로징 (룰북 §9) — 승자 발표 → 하우스 몫 → 폐회.
   순서는 규칙이다. 하우스 몫은 이 화면의 2단계에서 처음 나오고,
   그 전 어느 화면에도 부분합조차 실려 있지 않다.
   ============================================================ */
var CLT = {TERM0:140, TERM:300, WAIT:520, COUNT:900, TICK:45, VS:520};

function endGame(){
  rvClear();
  var rows = G.players.map(function(p, i){
    var held = p.items.reduce(function(s,it){ return s + it.value; }, 0);
    return {i:i, p:p, held:held, score: held + (1-SIT_FEE)*p.cash};
  });
  rows.sort(function(a,b){ return b.score - a.score; });
  G.final = rows;

  /* 네 항목을 합쳐 두지 않고 따로 들고 있는다. 클로징에서 하나씩 펴야 하고,
     펴 놓은 것들의 합이 총액과 맞는지 눈으로도 검산할 수 있어야 한다.
     자리세만 누적해 둔 곳이 없다 — 마지막 잔액에서 지금 뗀다 (룰북 §7). */
  var seat = G.players.reduce(function(s,p){ return s + p.cash * SIT_FEE; }, 0);
  G.cut = {
    seat: seat, fees: G.house.fees, buyback: G.house.buyback, unsold: G.house.unsold,
    total: seat + G.house.fees + G.house.buyback + G.house.unsold
  };

  G.close = {stage:0, timers:[], settled:false};
  G.sayRef = fixSay('closing.winner', {
    name:   function(L){ return rows[0].p.label[L]; },
    amount: function(){ return money(rows[0].score); }
  });
  show('end');
  renderEnd();
  /* 판이 끝난 뒤에야 한 줄 쓴다. 연출은 아직 진행 중이지만 숫자는 이미 다 확정됐다. */
  logGame();
}

function clClear(){
  if (!G.close) return;
  G.close.timers.forEach(function(c){ c(); });
  G.close.timers = [];
}
function clAt(ms, fn){
  var h = setTimeout(fn, ms);
  G.close.timers.push(function(){ clearTimeout(h); });
}

/* 연출 중간에 [폐회]를 누르면 먼저 이 상태로 건너뛴다. 리빌과 같은 규칙이다. */
function clSettle(){
  clClear();
  [].slice.call($('house-terms').children).forEach(function(el){ el.classList.add('shown'); });
  $('house-total').classList.add('shown');
  $('house-total-value').textContent = money(G.cut.total);
  $('house-vs').classList.add('shown');
  G.close.settled = true;
}

function clAdvance(){
  var C = G.close;
  if (C.stage === 0){
    C.stage = 1; C.settled = false;
    G.sayRef = fixSay('closing.houseCut', { amount: function(){ return money(G.cut.total); } });
    renderEnd();
    $('end-house').scrollIntoView({behavior: REDUCED ? 'auto' : 'smooth', block:'center'});
    return;
  }
  if (C.stage === 1){
    if (!C.settled){ clSettle(); return; }
    C.stage = 2;
    G.sayRef = fixSay('closing.farewell');
    renderEnd();
    window.scrollTo({top:0, behavior: REDUCED ? 'auto' : 'smooth'});
  }
}

/* ============================================================
   렌더
   ============================================================ */
function show(name){
  ['open','round','result','buyback','reveal','end'].forEach(function(s){
    $('screen-'+s).classList.toggle('on', s===name);
  });
  G && (G.screen = name);
  window.scrollTo({top:0, behavior:'auto'});
}

function hudHTML(){
  var me = G.players[0];
  return '<b>'+t('cash')+'</b> '+money(me.cash)
       + ' &nbsp; <b>'+t('held')+'</b> '+me.items.length
       + ' &nbsp; <b>'+t('appraised')+'</b> '+me.apprCount;
}
function lotTag(){
  return t('lot')+' '+String(G.round).padStart(2,'0')+' / '+N_ITEMS;
}

/* 입찰 중에는 봇의 현금·감정 횟수를 라운드 시작 시점(사전 감정 이전)의 값으로 보여준다.
   그러지 않으면 £10M 줄어든 잔액과 +1 늘어난 감정 횟수가 "이번 판에 누가 감정했는지"를
   입찰 전에 그대로 알려 준다. 룰북 §5는 그 사실을 낙찰 뒤에만 공개하도록 한다.
   내 줄은 내 정보이므로 언제나 실시간이다. */
function boardHTML(frozen){
  var head = '<div class="bh"><span>'+t('seats')+'</span><span>'+lotTag()+'</span></div>';
  var body = G.players.map(function(p, i){
    var badge = p.isUser ? '' : '<span class="seat-badge">'+p.badge+'</span>';
    var snap = (frozen && !p.isUser && G.snap) ? G.snap[i] : null;
    var cash = snap ? snap.cash : p.cash;
    var appr = snap ? snap.appr : p.apprCount;
    return '<tr class="'+(p.isUser?'you':'')+'">'
      + '<td>'+badge+esc(seatName(p))+'</td>'

/* ============================================================
   전적 — 끝난 판만
   ------------------------------------------------------------
   이 패널은 화면(.screen) 밖에 있어 경매 중에도 아래에 깔려 있다.
   그래서 여기에는 '지금 굴러가는 판'에 대한 숫자가 한 개도 실리면 안 된다.
   행은 폐회 때 딱 한 번 쓰고, 읽기는 집계 RPC로만 한다.
   ============================================================ */
function guestId(){
  try{
    var g = localStorage.getItem('kyg_guest_id');
    if (!g){
      g = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'g' + Date.now() + '-' + Math.random().toString(16).slice(2);
      localStorage.setItem('kyg_guest_id', g);
    }
    return g;
  }catch(e){ return null; }
}
function uuid4(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    var r = Math.random()*16|0, v = (c === 'x') ? r : ((r&0x3)|0x8);
    return v.toString(16);
  });
}

/* 낙찰품 집계는 G.items 에서 훑는다 — 매입 창에서 넘긴 물건은
   p.items 에서 빠져나가므로 소지품만 보면 치른 돈이 사라진다. */
function logGame(){
  try{
    if (!G || G.logged) return;
    var A = window.KYG_AUTH;
    if (!A || !A.client) return;
    G.logged = true;

    var meRow = null;
    for (var i=0;i<G.final.length;i++) if (G.final[i].i === 0) meRow = {rank:i+1, row:G.final[i]};
    if (!meRow) return;

    var won=0, sold=0, paid=0, val=0;
    G.items.forEach(function(it){
      if (it.owner !== 0) return;
      won += 1; paid += it.paid; val += it.value;
      if (it.soldToHouse) sold += 1;
    });

    var uid = A.user ? A.user.id : null;
    var row = {
      game_id: G.gameId, user_id: uid, guest_id: (uid ? null : guestId()),
      difficulty: G.tier.toLowerCase(), rules_ver: 'v1.2',
      rank: meRow.rank,
      score: Math.round(meRow.row.score),
      top_score: Math.round(G.final[0].score),
      house_cut: Math.round(G.cut.total),
      cut_seat: Math.round(G.cut.seat), cut_fees: Math.round(G.cut.fees),
      cut_buyback: Math.round(G.cut.buyback), cut_unsold: Math.round(G.cut.unsold),
      lots_won: won, lots_sold: sold, appraisals: G.players[0].apprCount,
      paid_total: Math.round(paid), value_total: Math.round(val)
    };
    A.client.from('pyr_games').insert([row]).then(function(res){
      if (res && res.error) console.warn('pyr log rejected', res.error.message);
      else if (uid) loadRecord();
    });
  }catch(e){ console.warn('pyr log failed', e); }
}

var REC = null;   // null = 아직 못 불러옴(또는 비로그인), {} = 로그인했으나 기록 없음
async function loadRecord(){
  var A = window.KYG_AUTH;
  if (!A || !A.client || !A.user){ REC = null; renderRecord(); return; }
  try{
    var r = await A.client.rpc('pyr_my_record');
    if (r.error) throw r.error;
    var map = {};
    (r.data || []).forEach(function(x){ map[x.difficulty] = x; });
    REC = map;
  }catch(e){ console.warn('pyr record load failed', e); REC = {}; }
  renderRecord();
}

var REC_TIERS = ['easy','normal','hard','brutal'];
function renderRecord(){
  $('rec-title').textContent = t('recTitle');
  var body = $('rec-body'), A = window.KYG_AUTH;

  if (!A || !A.user){
    body.innerHTML = '<p class="rec-note">' + t('recSignIn') + '</p>';
    return;
  }
  if (REC === null){
    body.innerHTML = '<p class="rec-note">' + t('recLoading') + '</p>';
    return;
  }
  var rows = REC_TIERS.filter(function(d){ return REC[d] && REC[d].games > 0; });
  if (!rows.length){
    body.innerHTML = '<p class="rec-note">' + t('recEmpty') + '</p>';
    return;
  }

  var G_ = 0, F_ = 0, B_ = 0, BEST = 0, SUM = 0;
  var trs = rows.map(function(d){
    var r = REC[d], n = r.games|0, f = r.firsts|0;
    G_ += n; F_ += f; B_ += (r.beat_house|0);
    if (r.best > BEST) BEST = r.best;
    SUM += (r.avg_score|0) * n;
    var rate = n ? Math.round(f * 1000 / n) / 10 : 0;
    return '<tr><td>' + TIER_LABEL(d) + '</td>'
      + '<td>' + n + '</td>'
      + '<td class="' + (f ? 'first' : '') + '">' + f + '</td>'
      + '<td>' + money(r.best) + '</td>'
      + '<td>' + money(r.avg_score) + '</td>'
      + '<td class="rate">' + rate.toFixed(1) + '%</td></tr>';
  }).join('');

  var tRate = G_ ? Math.round(F_ * 1000 / G_) / 10 : 0;
  trs += '<tr class="tot"><td>' + t('recTotal') + '</td>'
    + '<td>' + G_ + '</td><td class="' + (F_ ? 'first' : '') + '">' + F_ + '</td>'
    + '<td>' + money(BEST) + '</td>'
    + '<td>' + money(G_ ? SUM / G_ : 0) + '</td>'
    + '<td class="rate">' + tRate.toFixed(1) + '%</td></tr>';

  body.innerHTML =
    '<div class="rec-scroll"><table><thead><tr>'
    + '<th>' + t('recRoom') + '</th><th>' + t('recGames') + '</th><th>' + t('recFirst') + '</th>'
    + '<th>' + t('recBest') + '</th><th>' + t('recAvg') + '</th><th>' + t('recRate') + '</th>'
    + '</tr></thead><tbody>' + trs + '</tbody></table></div>'
    + '<p class="rec-foot' + (B_ ? ' hit' : '') + '">'
    + (B_ ? t('recBeatN', {n: B_}) : t('recBeat0')) + '</p>';
}
function TIER_LABEL(d){ return d.toUpperCase(); }

  renderRecord();
  if (!G) return;
  if (G.screen === 'round')  renderRound();
  if (G.screen === 'result') renderResult();
  if (G.screen === 'buyback')renderBuyback();
  if (G.screen === 'reveal') renderReveal();
  if (G.screen === 'end')    renderEnd();
});

/* 로그인 상태가 바뀌면 전적을 처음부터 다시 잡는다.
   로그아웃 시 REC 를 비우지 않으면 남의 숫자가 화면에 남는다. */
window.KYG_AUTH_LISTENERS = window.KYG_AUTH_LISTENERS || [];
window.KYG_AUTH_LISTENERS.push(function(user){
  REC = null; renderRecord();
  if (user) loadRecord();
});

renderOpen();
renderRecord();
/* auth-widget.js 는 defer 라 보통 이 뒤에 붙는다 — 그때는 위 리스너가 불러 준다.
   캐시가 빨라 먼저 앉아 있는 경우에는 아무도 안 부르므로 여기서 한 번 확인한다. */
if (window.KYG_AUTH && window.KYG_AUTH.user) loadRecord();
})();
</script>
<script src="/auth-widget.js" defer></script>
</body>
</html>
