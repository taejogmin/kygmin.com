<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CFA Study Hub &mdash; KYGMIN</title>
<meta name="description" content="Read the notes, drill CFA-style questions, keep a wrong-answer notebook and see which concepts keep tripping you up. Progress syncs to your account when you sign in." />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<!-- 언어는 localStorage 에 두고, 다음 페이지에서 첫 페인트 전에 복원한다 -->
<script>
window.KYG_LANG=(function(){try{var v=localStorage.getItem('kyg_lang');if(v==='kr'||v==='en')return v;}catch(e){}return 'en';})();
window.APP_LANG=window.KYG_LANG;
if(window.KYG_LANG!=='en'){
  document.documentElement.setAttribute('lang','ko');
  document.documentElement.className+=' lang-pending';
  setTimeout(function(){document.documentElement.classList.remove('lang-pending');},2000);
}
</script>
<style>html.lang-pending .tx{visibility:hidden}</style>

<style>
:root{
  --paper:#F6F6F4;
  --ink:#141414;
  --gray:#DDDDD8;
  --green:#2BB673;
  --green-deep:#0F6E56;
  --red:#A32D2D;
  --amber:#B7791F;
  --arch:'Archivo','Pretendard',sans-serif;
  --sans:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;
  --mono:'IBM Plex Mono','SF Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{transition:none!important;}
}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;}
a{color:inherit;text-decoration:none;}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--green);outline-offset:3px;}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px;}

/* ── Nav (site common) ── */
nav{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:3px solid var(--ink);}
.nav-inner{max-width:1040px;margin:0 auto;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;}
.logo{font-family:var(--arch);font-weight:900;font-size:19px;letter-spacing:-0.5px;white-space:nowrap;}
.logo em{font-style:normal;background:var(--green);color:var(--paper);padding:0 6px;display:inline-block;transform:rotate(-1.5deg);}
.nav-links{display:flex;gap:8px;flex-wrap:wrap;}
.nav-links a{font-family:var(--arch);font-size:12px;font-weight:700;text-transform:uppercase;border:2px solid var(--ink);padding:6px 13px;background:#fff;
  box-shadow:3px 3px 0 var(--ink);transition:transform .1s, box-shadow .1s;}
.nav-links a:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink);}
.nav-links a.on{background:var(--green);color:var(--paper);}

/* ── Hero ── */
header{padding:40px 0 26px;border-bottom:3px solid var(--ink);}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;}
.sec-tag{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--green-deep);letter-spacing:1px;display:block;margin-bottom:12px;}
h1{font-family:var(--arch);font-weight:900;text-transform:uppercase;font-size:clamp(30px, 5.6vw, 48px);line-height:1.02;letter-spacing:-2px;}
h1 .box{background:var(--ink);color:var(--paper);padding:0 12px;display:inline-block;transform:rotate(-1deg);}
.hero-sub{margin-top:14px;font-size:15px;max-width:620px;font-weight:500;}
.dday{border:3px solid var(--ink);background:#fff;box-shadow:5px 5px 0 var(--ink);padding:12px 18px;min-width:180px;}
.dday .k{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:#6B6B67;display:block;}
.dday .v{font-family:var(--arch);font-weight:900;font-size:34px;letter-spacing:-1.5px;line-height:1.1;}
.dday .v small{font-size:14px;letter-spacing:0;color:#6B6B67;margin-left:4px;}

main{padding:26px 0 90px;}

/* ── Tabs ── */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
.tab{font:inherit;font-family:var(--arch);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  border:3px solid var(--ink);padding:9px 16px;background:#fff;box-shadow:4px 4px 0 var(--ink);cursor:pointer;color:var(--ink);
  transition:transform .1s, box-shadow .1s;display:inline-flex;align-items:center;gap:8px;}
.tab:hover{transform:translate(1px,1px);box-shadow:3px 3px 0 var(--ink);}
.tab.on{background:var(--ink);color:var(--paper);}
.tab .n{font-family:var(--mono);font-size:10.5px;background:var(--green);color:var(--paper);padding:0 6px;border-radius:0;}
.view{display:none;} .view.on{display:block;}

/* ── Panels & primitives ── */
.panel{border:3px solid var(--ink);background:#fff;box-shadow:6px 6px 0 var(--ink);padding:22px 24px 24px;margin-bottom:22px;}
.panel h2{font-family:var(--arch);font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:-.2px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.panel h2 .sub{font-family:var(--mono);font-size:11px;font-weight:500;color:#6B6B67;text-transform:none;letter-spacing:0;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.chip{border:3px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);padding:8px 13px;font-family:var(--mono);font-size:12px;min-width:110px;}
.chip .k{display:block;font-size:10px;color:#6B6B67;letter-spacing:.5px;}
.chip .v{font-family:var(--arch);font-weight:900;font-size:19px;letter-spacing:-.5px;}
.chip.good .v{color:var(--green-deep);} .chip.bad .v{color:var(--red);}
.btn{display:inline-block;font:inherit;font-family:var(--arch);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;
  border:3px solid var(--ink);padding:10px 18px;box-shadow:4px 4px 0 var(--ink);transition:transform .1s, box-shadow .1s;background:#fff;cursor:pointer;color:var(--ink);}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
.btn.green{background:var(--green);color:var(--paper);}
.btn.ink{background:var(--ink);color:var(--paper);}
.btn.sm{font-size:11px;padding:6px 11px;box-shadow:3px 3px 0 var(--ink);border-width:2px;}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none;}
.btn[aria-pressed="true"]{background:var(--green);color:var(--paper);}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.mono{font-family:var(--mono);}
.muted{color:#6B6B67;}
.fine{font-family:var(--mono);font-size:11.5px;color:#6B6B67;line-height:1.75;margin-top:12px;border-top:1px solid var(--gray);padding-top:10px;}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.3px;border:2px solid var(--gray);padding:1px 8px;color:#4A4A46;background:#fff;margin:0 6px 6px 0;}
.tag.g{border-color:var(--green);color:var(--green-deep);}
.tag.r{border-color:var(--red);color:var(--red);}
.tag.a{border-color:var(--amber);color:var(--amber);}

<!-- 언어 토글: 페이지 로직과 독립된 스크립트 (사이트 공통 패턴) -->
<script>
window.APP_LANG = window.KYG_LANG || 'en';
window.APP_LANG_LISTENERS = window.APP_LANG_LISTENERS || [];
(function(){
  var POOL = ("\u3131\u3134\u3137\u3139\u3141\u3142\u3145\u3147\u3148\u314a\u314b\u314c\u314d\u314e"
    + "\u314f\u3151\u3153\u3155\u3157\u315b\u315c\u3160\u3161\u3163"
    + "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-\u00b7").split("");
  function esc(c){return c==="&"?"&amp;":c==="<"?"&lt;":c===">"?"&gt;":c;}
  function Scramble(el){ this.el=el; this.raf=null; this.frame=this.frame.bind(this); }
  Scramble.prototype.set=function(txt){
    var old = this.el.dataset.plain!==undefined ? this.el.dataset.plain : this.el.textContent;
    var len=Math.max(old.length, txt.length);
    this.q=[];
    for(var i=0;i<len;i++){
      var from=old[i]||"", to=txt[i]||"";
      var start=Math.floor(Math.random()*20);
      var end=start+Math.floor(Math.random()*25)+12;
      this.q.push({from:from,to:to,start:start,end:end,ch:null});
    }
    if(this.raf) cancelAnimationFrame(this.raf);
    this.f=0; this.t0=null; this.txt=txt; this.frame();
  };
  /* 진행도를 «프레임 수»가 아니라 «경과 시간»으로 센다.
     프레임을 세면 144Hz 화면에서 같은 애니메이션이 60Hz의 2.42배로 끝난다
     (최악 55프레임 = 60Hz 917ms 대 145Hz 379ms). 짧은 라벨은 0.2초에 끝나서
     사람 눈에는 «애니메이션이 안 된다»로 보인다. 기준은 60fps 로 고정한다. */
  Scramble.prototype.frame=function(ts){
    var now = (typeof ts === 'number') ? ts : performance.now();
    if(this.t0===null || this.t0===undefined) this.t0=now;
    this.f = (now - this.t0) / (1000/60);
    var out="", done=0;
    for(var i=0;i<this.q.length;i++){
      var it=this.q[i];
      if(this.f>=it.end){ done++; out+=esc(it.to); }
      else if(this.f>=it.start){
        if(!it.ch || Math.random()<0.3){ it.ch=POOL[Math.floor(Math.random()*POOL.length)]; }
        out+='<span class="scr">'+esc(it.ch)+'</span>';
      } else out+=esc(it.from);
    }
    this.el.innerHTML=out;
    if(done===this.q.length){ this.el.dataset.plain=this.txt; this.raf=null; }
    else { this.raf=requestAnimationFrame(this.frame); }
  };
  /* 탭이 배경이면 rAF 가 0프레임이라 스크램블이 중간 상태로 얼어붙는다. 본문은 즉시 바뀌므로
     「위만 깨진」 화면이 된다. 그때만 애니메이션을 건너뛴다.

     prefers-reduced-motion 은 보지 않는다 — 사이트의 다른 페이지가 전부 안 보기 때문이다.
     한 페이지만 모션 설정을 존중하면 같은 사이트에서 언어 전환이 페이지마다 다르게 보인다.
     (접근성 쪽으로 가려면 이 가드를 여기 되살릴 게 아니라 사이트 전체에 같이 넣어야 한다.) */
  function noAnim(){
    try{ return document.visibilityState !== 'visible'; }catch(e){ return false; }
  }
  Scramble.prototype.settle=function(txt){
    if(this.raf) cancelAnimationFrame(this.raf);
    this.raf=null; this.el.textContent=txt; this.el.dataset.plain=txt;
  };
  /* 본문 패널(엔진이 innerHTML 로 그리는 영역)에서도 쓸 수 있게 내보낸다. */
  window.KYG_Scramble = Scramble;
  window.KYG_noAnim   = noAnim;

  var els=[].slice.call(document.querySelectorAll('.tx'));
  els.forEach(function(el){ el.dataset.plain=el.textContent; el._s=new Scramble(el); });
  /* 탭이 다시 보이면 얼어 있던 것을 확정한다 — 돌아왔는데 깨진 글자가 남아 있으면 안 된다. */
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState !== 'visible') return;
    var L = window.APP_LANG || 'en';
    els.forEach(function(el){ var t=el.dataset[L];
      if(t!==undefined && el.textContent!==t) el._s.settle(t); });
  });
  // 저장된 언어를 애니메이션 없이 즉시 반영한다 (페이지 이동 후 복원)
  (function(){
    var L = window.KYG_LANG || 'en';
    var btns=document.querySelectorAll('#langtoggle button');
    for(var i=0;i<btns.length;i++){ btns[i].classList.toggle('on', btns[i].dataset.lang===L); }

    document.documentElement.classList.remove('lang-pending');
  })();
  function setLang(lang){
    if(lang===window.APP_LANG) return;
    window.APP_LANG = lang;
    try{ localStorage.setItem('kyg_lang', lang); }catch(e){}
    document.documentElement.lang = (lang==='kr'?'ko':'en');
    var btns=document.querySelectorAll('#langtoggle button');
    for(var i=0;i<btns.length;i++){ btns[i].classList.toggle('on', btns[i].dataset.lang===lang); }
    var skip = noAnim();
    els.forEach(function(el){
      var t=el.dataset[lang]; if(t===undefined) return;
      if(skip) el._s.settle(t);
      else {
        el._s.set(t);
        /* 그물망: 3.5초 뒤에도 안 끝났으면 강제로 확정한다. rAF 가 도중에 끊겨도 글자가 안 남는다. */
        (function(e2,txt){ setTimeout(function(){
          if(e2.textContent!==txt) e2._s.settle(txt); }, 3500); })(el,t);
      }
    });
    window.APP_LANG_LISTENERS.forEach(function(fn){ try{ fn(lang); }catch(e){ console.error(e); } });
  }
  document.getElementById('langtoggle').addEventListener('click', function(e){
    var b=e.target.closest('button'); if(b) setLang(b.dataset.lang);
  });
})();
</script>

function loadLocal(){
  try{
    var a=JSON.parse(localStorage.getItem('cfa_attempts')||'[]'); var p=JSON.parse(localStorage.getItem('cfa_progress')||'{}'); var o=localStorage.getItem('cfa_owner')||'guest';
    STORE.attempts=Array.isArray(a)?a:[]; STORE.progress={ read:(p&&p.read)||{}, settings:(p&&p.settings)||{} }; STORE.owner=o;
  }catch(e){ STORE={ owner:'guest', attempts:[], progress:{read:{},settings:{}} }; }
}
function saveLocal(){
  try{ localStorage.setItem('cfa_attempts', JSON.stringify(STORE.attempts)); localStorage.setItem('cfa_progress', JSON.stringify(STORE.progress)); localStorage.setItem('cfa_owner', STORE.owner); }catch(e){}

/* ── Supabase sync ──────────────────────────────────────────────────── */
window.KYG_AUTH_LISTENERS = window.KYG_AUTH_LISTENERS || [];

  var uid=user?user.id:null;
  if(uid!==lastUserId){ lastUserId=uid; if(uid) syncAll(uid); else { syncState='local'; render(); } }
});

function syncAll(uid){
  if(!AUTH.client) return Promise.resolve();
  syncState='syncing'; render();
  var localGuest = (STORE.owner==='guest');
  if(STORE.owner!=='guest' && STORE.owner!==uid){ // another account's cache in this browser — start clean
    STORE={ owner:uid, attempts:[], progress:{read:{},settings:{}} };
  }
  var c=AUTH.client;
  return fetchAllAttempts(c).then(function(serverRows){
    var byClient={}; serverRows.forEach(function(r){ byClient[r.client_id]=true; });
    var toUpload=[];
    STORE.attempts.forEach(function(a){ if(!byClient[a.client_id]) toUpload.push(rowFromAttempt(a, uid)); });
    var merged = serverRows.map(attemptFromRow);
    STORE.attempts.forEach(function(a){ if(!byClient[a.client_id]) merged.push(Object.assign({}, a, {synced:true})); });
    merged.sort(function(x,y){ return x.t<y.t?-1:1; });
    STORE.attempts=merged; STORE.owner=uid;
    var up = toUpload.length ? c.from('cfa_attempts').insert(toUpload) : Promise.resolve({});
    return up;
  }).then(function(res){
    if(res && res.error) console.error('cfa_attempts insert', res.error);
    return c.from('cfa_progress').select('key,value,updated_at');
  }).then(function(res){
    if(res.error) throw res.error;
    var server={}; (res.data||[]).forEach(function(r){ server[r.key]=r; });
    // read: union
    var read=STORE.progress.read||{}; var sread=(server.read&&server.read.value)||{};
    Object.keys(sread).forEach(function(m){ var set={}; (read[m]||[]).concat(sread[m]||[]).forEach(function(s){ set[s]=1; }); read[m]=Object.keys(set); });
    STORE.progress.read=read;
    // settings: newer wins
    var ls=STORE.progress.settings||{}; var ss=(server.settings&&server.settings.value)||{};
    var lt=ls._t||0, st=(server.settings&&Date.parse(server.settings.updated_at))||0;
    STORE.progress.settings = (st>lt) ? Object.assign({}, ls, ss, {_t:st}) : Object.assign({}, ss, ls);
    saveLocal();
    return pushProgress();
  }).then(function(){ syncState='account'; syncMsg=null; render(); })
    .catch(function(e){ console.error('sync', e); syncState='failed'; syncMsg=t('syncFail'); render(); });
}
function fetchAllAttempts(c){
  var all=[]; function page(from){ return c.from('cfa_attempts').select('*').order('created_at',{ascending:true}).range(from, from+999).then(function(res){
    if(res.error) throw res.error; all=all.concat(res.data||[]); return (res.data&&res.data.length===1000) ? page(from+1000) : all; }); }
  return page(0);
}
function rowFromAttempt(a, uid){ return { user_id:uid, client_id:a.client_id, qid:a.qid, module:a.module, section:a.section||null, concept:a.concept||null, qtype:a.qtype||null, trap:a.trap||null, mode:a.mode||null, choice:a.choice||null, correct:!!a.correct, time_ms:a.time_ms||null, created_at:a.t }; }
function attemptFromRow(r){ return { client_id:r.client_id, qid:r.qid, module:r.module, section:r.section, concept:r.concept, qtype:r.qtype, trap:r.trap, mode:r.mode, choice:r.choice, correct:!!r.correct, time_ms:r.time_ms, t:r.created_at, synced:true }; }
function pushAttempt(a){
  if(!AUTH.client||!AUTH.user) return;
  AUTH.client.from('cfa_attempts').insert(rowFromAttempt(a, AUTH.user.id)).then(function(res){
    if(res.error){ console.error('insert attempt', res.error); syncState='failed'; syncMsg=t('syncFail'); }
    else { a.synced=true; saveLocal(); if(syncState==='failed'){ syncState='account'; syncMsg=null; } }
  }).catch(function(e){ console.error(e); });
}
function pushProgress(){
  if(!AUTH.client||!AUTH.user) return Promise.resolve();
  var uid=AUTH.user.id, now=new Date().toISOString();
  STORE.progress.settings._t=Date.now();
  return AUTH.client.from('cfa_progress').upsert([
    { user_id:uid, key:'read', value:STORE.progress.read||{}, updated_at:now },
    { user_id:uid, key:'settings', value:STORE.progress.settings||{}, updated_at:now }
  ], { onConflict:'user_id,key' }).then(function(res){ if(res.error) console.error('cfa_progress upsert', res.error); });
}

/* ── content loading ────────────────────────────────────────────────── */
function fetchJSON(u){ return fetch(u,{cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error(u); return r.json(); }); }
function fetchText(u){ return fetch(u,{cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error(u); return r.text(); }); }
function loadContent(){
  return fetchJSON('content/manifest.json').then(function(m){
    MANIFEST=m; MODULES=m.modules.slice().sort(function(a,b){ return a.order-b.order; });
    var weakP=fetchJSON('content/weakspots.json').then(function(w){ WEAK=w; }, function(){ WEAK=null; });
    return Promise.all([weakP].concat(MODULES.map(function(mod){
      return Promise.all([fetchText(mod.notes), fetchJSON(mod.questions)]).then(function(r){
        NOTES[mod.id]=r[0]; SECTIONS[mod.id]=parseSections(r[0]);
        (r[1].questions||[]).forEach(function(q){ q.module=mod.id; QBYID[q.id]=q; QLIST.push(q); });
      });
    })));
  });
}
var NUMRE=/^(\d+[a-z]?(?:\.\d+)?)\.?\s+(.*)$/;
function parseSections(md){
  var out=[]; md.split('\n').forEach(function(line){
    var m=/^(##|###)\s+(.*)$/.exec(line); if(!m) return;
    var txt=m[2].replace(/[*_`]/g,'').trim(); var n=NUMRE.exec(txt); if(!n) return;

/* ── derived stats ──────────────────────────────────────────────────── */
function historyByQ(){ var h={}; STORE.attempts.forEach(function(a){ (h[a.qid]=h[a.qid]||[]).push(a); }); return h; }
function qStatus(hist){ // {wrong, total, due, mastered, lastWrong, streak}
  var wrong=0, streak=0, lastWrong=false, anyWrong=false;
  hist.forEach(function(a){ if(a.correct){ streak++; } else { wrong++; streak=0; anyWrong=true; } });
  lastWrong = hist.length ? !hist[hist.length-1].correct : false;
  var due = anyWrong && streak<2; var mastered = anyWrong && streak>=2;
  return { wrong:wrong, total:hist.length, due:due, mastered:mastered, lastWrong:lastWrong, streak:streak };
}
function reviewItems(){ var h=historyByQ(); var out=[]; Object.keys(h).forEach(function(qid){ var q=QBYID[qid]; if(!q) return; var s=qStatus(h[qid]); if(s.wrong>0) out.push({q:q,s:s,last:h[qid][h[qid].length-1]}); }); return out; }
function dueItems(){ return reviewItems().filter(function(x){ return x.s.due; }); }
function groupAcc(keyFn, filter){
  var g={}; STORE.attempts.forEach(function(a){ if(filter&&!filter(a)) return; var k=keyFn(a); if(k==null) return; var o=(g[k]=g[k]||{n:0,c:0,ms:0,msn:0}); o.n++; if(a.correct) o.c++; if(a.time_ms){ o.ms+=a.time_ms; o.msn++; } });
  return Object.keys(g).map(function(k){ var o=g[k]; return {key:k,n:o.n,c:o.c,acc:pct(o.c,o.n),wrong:o.n-o.c,avgMs:o.msn?o.ms/o.msn:0}; });
}
function conceptScores(){ // higher = weaker
  var g={}; var h=historyByQ();
  QLIST.forEach(function(q){ if(q.type==='flash') return; var c=q.concept; var o=(g[c]=g[c]||{concept:c,module:q.module,section:q.section,n:0,wrong:0,qids:[],lastWrong:false}); o.qids.push(q.id);
    var hist=h[q.id]||[]; hist.forEach(function(a){ o.n++; if(!a.correct) o.wrong++; }); if(hist.length && !hist[hist.length-1].correct) o.lastWrong=true; });
  return Object.keys(g).map(function(k){ var o=g[k]; o.score = o.wrong*2 + (o.lastWrong?2:0) - (o.n-o.wrong)*0.5; o.acc=o.n?pct(o.n-o.wrong,o.n):null; return o; });
}
function patternStats(pat){ var n=0,c=0; STORE.attempts.forEach(function(a){ if(a.qtype==='flash') return; if(pat.traps.indexOf(a.trap)>=0){ n++; if(a.correct) c++; } }); return {n:n,c:c,acc:pct(c,n)}; }
function patternPool(pat){
  var h=historyByQ(); var seed=(pat.seed||[]).map(function(id){ return QBYID[id]; }).filter(Boolean);
  var rest=QLIST.filter(function(q){ return q.type!=='flash' && pat.traps.indexOf(q.trap)>=0 && (pat.seed||[]).indexOf(q.id)<0; });
  function pri(q){ var hist=h[q.id]||[]; var st=qStatus(hist); return (st.due?0:hist.length?2:1); }   // due first, then unseen, then mastered
  return shuffle(seed).sort(function(a,b){ return pri(a)-pri(b); }).concat(shuffle(rest).sort(function(a,b){ return pri(a)-pri(b); }));
}
function openOfficialMisses(){ if(!WEAK) return []; var h=historyByQ(); return WEAK.official_misses.filter(function(m){ var q=QBYID[m.qid]; if(!q) return false; var hist=h[m.qid]||[]; return !(hist.length && qStatus(hist).streak>=2); }).map(function(m){ return {m:m,q:QBYID[m.qid]}; }); }
function streakDays(){ var days={}; STORE.attempts.forEach(function(a){ days[dayKey(a.t)]=1; }); var n=0; var d=new Date(); for(;;){ var k=dayKey(d.toISOString()); if(days[k]){ n++; d.setDate(d.getDate()-1); } else { if(n===0){ d.setDate(d.getDate()-1); if(days[dayKey(d.toISOString())]){ continue; } } break; } } return n; }

    +'<div><span class="tag">'+esc(m?m.short:q.module)+'</span><span class="tag">§'+esc(q.section)+'</span><span class="tag">'+esc(q.concept)+'</span><span class="tag '+(q.type==='calc'?'a':q.type==='flash'?'g':'')+'">'+esc(t(q.type))+'</span>'+(q.difficulty?'<span class="tag">'+'★'.repeat(q.difficulty)+'</span>':'')+(q.source==='cfai'?'<span class="tag a">'+esc(t('src_cfai'))+'</span>':'')+'</div>';
  if(q.type==='flash'){
    h+='<div class="flashcard"><span class="side">FRONT</span><div class="front">'+esc(q.front)+'</div>'+(quiz.revealed?'<span class="side" style="margin-top:14px">BACK</span><div class="back">'+esc(q.back)+'</div>':'')+'</div>';
    if(!quiz.revealed) h+='<div class="acts"><button class="btn ink" id="reveal">'+esc(t('showAnswer'))+'</button></div>';
    else h+='<div class="acts"><button class="btn green" data-flash="got">'+esc(t('got'))+'</button><button class="btn" data-flash="missed">'+esc(t('missed'))+'</button><a class="btn sm" href="#" data-gonote="'+esc(q.module)+'|sec-'+esc(q.section)+'">'+esc(t('readSection'))+esc(q.section)+'</a></div>';
  } else {
    var letters=['A','B','C']; var map={}; quiz.order.forEach(function(orig,i){ map[orig]=letters[i]; });
    h+='<p class="stem">'+esc(q.stem)+'</p><div class="choices">';
    quiz.order.forEach(function(orig,i){
      var cls='choice'; if(quiz.pick){ if(orig===q.answer) cls+=' right'; else if(orig===quiz.pick) cls+=' wrong'; else cls+=' dim'; }
      h+='<button class="'+cls+'" data-pick="'+orig+'"'+(quiz.pick?' disabled':'')+'><span class="key">'+letters[i]+'</span><span>'+esc(q.choices[orig])+'</span></button>';
    });
    h+='</div>';
    if(quiz.pick){
      var ok=quiz.pick===q.answer;
      h+='<div class="verdict '+(ok?'ok':'no')+'">'+esc(ok?t('correct'):t('incorrect'))+(ok?'':' — '+esc(t('yourPick'))+' '+map[quiz.pick]+', '+esc(t('correct'))+' '+map[q.answer])+'</div>';
      h+='<div class="explain"><b>'+esc(t('explain'))+'.</b> '+esc(remapLetters(q.explanation, map))+'</div>';
      if(q.kr) h+='<div class="explain kr"><b>'+esc(t('kr_note'))+'.</b> '+esc(remapLetters(q.kr, map))+'</div>';
      h+='<div class="acts"><button class="btn green" id="nextQ">'+esc(quiz.i+1<total?t('next'):t('finish'))+'</button><a class="btn sm" href="#" data-gonote="'+esc(q.module)+'|sec-'+esc(q.section)+'">'+esc(t('readSection'))+esc(q.section)+'</a></div>';
    }
  }
  h+='</div>';
  el.innerHTML=h;
}
function record(q, choice, correct){
  var a={ client_id:uuid(), qid:q.id, module:q.module, section:q.section, concept:q.concept, qtype:q.type, trap:q.trap, mode:quiz.mode, choice:choice, correct:correct, time_ms:Math.min(Date.now()-quiz.t0, 20*60*1000), t:new Date().toISOString(), synced:false };
  STORE.attempts.push(a); saveLocal(); pushAttempt(a); quiz.results.push({q:q,correct:correct,choice:choice});
}
function answer(orig){ var q=quiz.items[quiz.i]; if(quiz.pick) return; quiz.pick=orig; record(q, orig, orig===q.answer); renderReviewBadge(); renderQuestion($('view-quiz')); }
function nextQ(){ quiz.i++; quiz.pick=null; quiz.revealed=false; quiz.order=null; renderQuiz(); }
function renderSummary(el){
  var r=quiz.results; var n=r.filter(function(x){ return x.q.type!=='flash'; }).length; var c=r.filter(function(x){ return x.q.type!=='flash'&&x.correct; }).length;
  var wrong=r.filter(function(x){ return !x.correct; }); var ms=0, mn=0; STORE.attempts.slice(-r.length).forEach(function(a){ if(a.time_ms){ ms+=a.time_ms; mn++; } });
  var h='<div class="panel summary"><h2>'+esc(t('s_done'))+'</h2><div class="chips"><div class="chip '+(pct(c,n)>=70?'good':'bad')+'"><span class="k">'+esc(t('s_score'))+'</span><span class="v">'+(n?c+'/'+n+' · '+pct(c,n)+'%':r.length-wrong.length+'/'+r.length)+'</span></div><div class="chip"><span class="k">'+esc(t('s_time'))+'</span><span class="v">'+fmtMs(mn?ms/mn:0)+'</span></div></div>';
  if(wrong.length){ h+='<h2 style="margin-top:8px">'+esc(t('s_wrong'))+'</h2><div class="wronglist">'; wrong.forEach(function(x){ var m=modById(x.q.module); h+='<div class="row"><div class="k"><b>'+esc(x.q.type==='flash'?x.q.front:x.q.stem)+'</b><small>'+esc(m?m.short:'')+' · §'+esc(x.q.section)+' · '+esc(x.q.concept)+' · '+esc(trapName(x.q.trap))+'</small></div><a class="btn sm" href="#" data-gonote="'+esc(x.q.module)+'|sec-'+esc(x.q.section)+'">'+esc(t('readSection'))+esc(x.q.section)+'</a></div>'; }); h+='</div>'; }
  else h+='<p class="empty">'+esc(t('s_perfect'))+'</p>';
  h+='<div class="acts" style="margin-top:14px">'+(wrong.length?'<button class="btn green" id="retryWrong">'+esc(t('s_retry'))+'</button>':'')+'<button class="btn" id="newQuiz">'+esc(t('s_again'))+'</button><button class="btn" data-go="home">'+esc(t('s_home'))+'</button></div></div>';
  el.innerHTML=h;
}

/* ── REVIEW ─────────────────────────────────────────────────────────── */
function renderReview(){
  var el=$('view-review'); var items=reviewItems().sort(function(a,b){ return (b.s.due-a.s.due) || (b.s.wrong-a.s.wrong); }); var due=items.filter(function(x){ return x.s.due; });
  var h='';
  var om=openOfficialMisses();
  if(om.length){ h+='<div class="panel pat"><h2>'+esc(t('r_official'))+'<span class="sub">'+esc(t('r_official_sub'))+'</span></h2>';
    om.forEach(function(x){ h+='<div class="row"><div class="k"><b>'+esc(x.q.stem)+'</b><small>'+esc(x.m.when)+' · §'+esc(x.q.section)+' · '+esc(trapName(x.q.trap))+'</small><div class="ev" style="margin-top:4px">'+esc(x.m.note)+'</div></div><div class="acts"><button class="btn sm green" data-retry="'+esc(x.q.id)+'">'+esc(t('r_retry'))+'</button><a class="btn sm" href="#" data-gonote="'+esc(x.q.module)+'|sec-'+esc(x.q.section)+'">§'+esc(x.q.section)+'</a></div></div>'; });
    h+='<div class="acts" style="margin-top:10px"><button class="btn" data-drill="official">'+esc(t('r_official_all'))+' ('+om.length+')</button></div></div>'; }
  h+='<div class="panel"><h2>'+esc(t('r_title'))+'<span class="sub">'+esc(t('r_sub'))+'</span></h2>';
  if(!items.length){ h+='<p class="empty">'+esc(t('r_empty'))+'</p></div>'; el.innerHTML=h; return; }
  h+='<div class="acts" style="margin-bottom:10px"><button class="btn green" data-drill="due"'+(due.length?'':' disabled')+'>'+esc(t('r_drill'))+' ('+due.length+')</button></div>';
  var byMod={}; items.forEach(function(x){ (byMod[x.q.module]=byMod[x.q.module]||[]).push(x); });
  MODULES.forEach(function(m){ var list=byMod[m.id]; if(!list) return; h+='<h2 style="margin-top:10px">'+esc(m.short)+' <span class="sub">'+list.length+'</span></h2>';
    list.forEach(function(x){ var q=x.q; var st=x.s.mastered?'<span class="tag g">'+esc(t('r_mastered'))+'</span>':x.s.lastWrong?'<span class="tag r">'+esc(t('r_lastWrong'))+'</span>':'<span class="tag a">'+esc(t('r_needOne'))+'</span>';
      h+='<div class="row"><div class="k"><b>'+esc(q.type==='flash'?q.front:q.stem)+'</b><small>§'+esc(q.section)+' · '+esc(q.concept)+' · '+esc(trapName(q.trap))+' · '+x.s.wrong+' '+esc(t('r_wrongN'))+' / '+x.s.total+'</small><div style="margin-top:4px">'+st+'</div></div>'
        +'<div class="acts"><button class="btn sm" data-retry="'+esc(q.id)+'">'+esc(t('r_retry'))+'</button><a class="btn sm" href="#" data-gonote="'+esc(q.module)+'|sec-'+esc(q.section)+'">§'+esc(q.section)+'</a></div></div>'; }); });
  h+='</div>'; el.innerHTML=h;
}

/* ── INSIGHTS ───────────────────────────────────────────────────────── */
function hbars(rows, labelFn, redIfLow){
  if(!rows.length) return '<p class="empty">'+esc(t('i_none'))+'</p>';
  var h=''; rows.forEach(function(r){ var lab=labelFn(r); h+='<div class="hbar"><div class="lbl" title="'+esc(lab.main)+'">'+esc(lab.main)+(lab.sub?'<small>'+esc(lab.sub)+'</small>':'')+'</div><div class="bar'+(redIfLow&&r.acc<60?' red':'')+'"><i style="width:'+r.acc+'%"></i></div><div class="val">'+r.acc+'%</div></div>'; }); return h;
}
function renderInsights(){
  var el=$('view-insights'); var graded=function(a){ return a.qtype!=='flash'; };
  var n=STORE.attempts.filter(graded).length, c=STORE.attempts.filter(function(a){ return graded(a)&&a.correct; }).length; var ms=0,mn=0; STORE.attempts.forEach(function(a){ if(graded(a)&&a.time_ms){ ms+=a.time_ms; mn++; } });
  var h='<div class="panel"><h2>'+esc(t('i_title'))+'</h2><div class="chips"><div class="chip"><span class="k">'+esc(t('attempts'))+'</span><span class="v">'+n+'</span></div><div class="chip '+(n?(pct(c,n)>=70?'good':'bad'):'')+'"><span class="k">'+esc(t('accuracy'))+'</span><span class="v">'+(n?pct(c,n)+'%':'—')+'</span></div><div class="chip"><span class="k">'+esc(t('i_timeAvg'))+'</span><span class="v">'+fmtMs(mn?ms/mn:0)+'</span></div><div class="chip"><span class="k">'+esc(t('due'))+'</span><span class="v">'+dueItems().length+'</span></div></div>';
  // trend
  h+='<h2>'+esc(t('i_trend'))+'</h2>'+trendSvg()+'</div>';
  // by module
  var byMod=groupAcc(function(a){ return a.module; }, graded);
  h+='<div class="panel"><h2>'+esc(t('i_module'))+'</h2>'+hbars(byMod, function(r){ var m=modById(r.key); return {main:m?m.short:r.key, sub:r.n+' '+t('qs')+' · '+r.wrong+' '+t('misses')}; }, true)+'</div>';
  // by trap
  var byTrap=groupAcc(function(a){ return a.trap||null; }, graded).filter(function(r){ return r.n>=2; }).sort(function(a,b){ return a.acc-b.acc; }).slice(0,10);
  h+='<div class="panel"><h2>'+esc(t('i_trap'))+'<span class="sub">'+esc(t('i_min'))+'</span></h2>'+hbars(byTrap, function(r){ return {main:trapName(r.key), sub:r.wrong+' '+t('misses')+' / '+r.n}; }, true)+'</div>';
  // by section
  var bySec=groupAcc(function(a){ return a.module+'|'+(a.section||'?'); }, graded).filter(function(r){ return r.n>=2; }).sort(function(a,b){ return a.acc-b.acc; }).slice(0,12);
  h+='<div class="panel"><h2>'+esc(t('i_section'))+'<span class="sub">'+esc(t('i_min'))+'</span></h2>'+hbars(bySec, function(r){ var p=r.key.split('|'); var m=modById(p[0]); var sec=(SECTIONS[p[0]]||[]).filter(function(s){ return s.num===p[1]; })[0]; return {main:'§'+p[1]+' '+(sec?sec.title:''), sub:(m?m.short:'')+' · '+r.wrong+' '+t('misses')+' / '+r.n}; }, true)+'</div>';
  // by type
  var byType=groupAcc(function(a){ return a.qtype||'mc'; }, graded);
  h+='<div class="panel"><h2>'+esc(t('i_type'))+'</h2>'+hbars(byType, function(r){ return {main:t(r.key), sub:r.n+' '+t('qs')}; }, true)+'</div>';
  // repeat misses
  var rep=reviewItems().filter(function(x){ return x.s.wrong>=2; }).sort(function(a,b){ return b.s.wrong-a.s.wrong; }).slice(0,10);
  h+='<div class="panel"><h2>'+esc(t('i_repeat'))+'</h2>'; if(!rep.length) h+='<p class="empty">'+esc(t('i_none'))+'</p>'; rep.forEach(function(x){ var m=modById(x.q.module); h+='<div class="row"><div class="k"><b>'+esc(x.q.type==='flash'?x.q.front:x.q.stem)+'</b><small>'+esc(m?m.short:'')+' · §'+esc(x.q.section)+' · '+esc(x.q.concept)+' · '+esc(trapName(x.q.trap))+'</small></div><div class="v" style="color:var(--red)">'+x.s.wrong+'×</div><button class="btn sm" data-retry="'+esc(x.q.id)+'">'+esc(t('r_retry'))+'</button></div>'; }); h+='</div>';
  // settings / export
  h+='<div class="panel"><h2>'+esc(t('h_sync'))+'</h2><div class="acts" style="margin-bottom:12px"><label class="mono" style="font-size:12px">'+esc(t('i_date'))+' <input type="date" id="examDate" value="'+esc(examDate())+'" /></label></div>'
    +'<div class="acts"><button class="btn" id="exportBtn">'+esc(t('i_export'))+'</button><button class="btn" id="clearBtn">'+esc(clearArmed?t('i_clear2'):t('i_clear'))+'</button><span class="mono muted" id="clearMsg" style="font-size:12px"></span></div><p class="fine">'+esc(t('i_exportNote'))+'</p>'+syncLine()+'</div>';
  el.innerHTML=h;
  $('examDate').addEventListener('change', function(){ if(!this.value) return; STORE.progress.settings.examDate=this.value; saveLocal(); pushProgress(); renderDday(); });
}
function trendSvg(){
  var days=[]; var d=new Date(); d.setHours(0,0,0,0); for(var i=13;i>=0;i--){ var x=new Date(d); x.setDate(d.getDate()-i); days.push(dayKey(x.toISOString())); }
  var byDay={}; STORE.attempts.forEach(function(a){ if(a.qtype==='flash') return; var k=dayKey(a.t); var o=(byDay[k]=byDay[k]||{n:0,c:0}); o.n++; if(a.correct) o.c++; });
  var max=1; days.forEach(function(k){ if(byDay[k]&&byDay[k].n>max) max=byDay[k].n; });
  if(max===1 && !days.some(function(k){ return byDay[k]; })) return '<p class="empty">'+esc(t('i_noTrend'))+'</p>';
  var W=700,H=120,pad=22,bw=(W-pad*2)/14; var s='<svg class="spark" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(t('i_trend'))+'">';
  s+='<line x1="'+pad+'" y1="'+(H-20)+'" x2="'+(W-pad)+'" y2="'+(H-20)+'"/>';
  days.forEach(function(k,i){ var o=byDay[k]; var x=pad+i*bw+4; var w=bw-8; if(o){ var hh=(H-30)*o.n/max; var hc=hh*o.c/o.n; s+='<rect class="no" x="'+x+'" y="'+(H-20-hh)+'" width="'+w+'" height="'+hh+'"/><rect class="ok" x="'+x+'" y="'+(H-20-hc)+'" width="'+w+'" height="'+hc+'"/><text x="'+(x+w/2)+'" y="'+(H-24-hh)+'" text-anchor="middle">'+o.n+'</text>'; }
    if(i%2===1) s+='<text x="'+(x+w/2)+'" y="'+(H-6)+'" text-anchor="middle">'+k.slice(5)+'</text>'; });
  return s+'</svg>';
}
function exportJSON(){
  var byConcept=conceptScores().filter(function(o){ return o.n>0; }).map(function(o){ return {concept:o.concept,module:o.module,section:o.section,attempts:o.n,wrong:o.wrong,accuracy:o.acc}; });
  var out={ exported_at:new Date().toISOString(), app:'kygmin.com/playhouse/cfa', exam_date:examDate(), owner:STORE.owner==='guest'?'guest':'account',
    summary:{ attempts:STORE.attempts.length, by_module:groupAcc(function(a){ return a.module; }), by_trap:groupAcc(function(a){ return a.trap||null; }), by_concept:byConcept, review_due:dueItems().map(function(x){ return x.q.id; }) },
    read:STORE.progress.read, attempts:STORE.attempts.map(function(a){ var q=QBYID[a.qid]; return Object.assign({}, a, { stem:q?(q.stem||q.front):null, answer:q?q.answer:null }); }) };
  var blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='cfa-study-hub-'+dayKey(new Date().toISOString())+'.json'; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ── global click routing ───────────────────────────────────────────── */
document.addEventListener('click', function(e){
  var b;
  if((b=e.target.closest('[data-go]'))){ quiz=null; setView(b.dataset.go); return; }
  if((b=e.target.closest('[data-read]'))){ studyModule=b.dataset.read; setView('study'); return; }
  if((b=e.target.closest('[data-study]'))){ studyModule=b.dataset.study; renderStudy(); return; }
  if((b=e.target.closest('[data-studysubj]'))){ var fm=modulesOf(b.dataset.studysubj)[0]; if(fm){ studyModule=fm.id; renderStudy(); } return; }
  if((b=e.target.closest('[data-collapse]'))){ toggleCollapse(b.dataset.collapse); return; }
  if((b=e.target.closest('[data-quizmod]'))){ SETUP.modules={}; SETUP.modules[b.dataset.quizmod]=true; SETUP.mode='std'; startQuiz(buildPool(),'std'); return; }
  if((b=e.target.closest('[data-quizsec]'))){ var qs=shuffle(questionsFor(studyModule, b.dataset.quizsec).filter(function(q){ return q.type!=='flash'; })); startQuiz(qs,'section'); return; }
  if((b=e.target.closest('[data-markread]'))){ toggleRead(b.dataset.markread); return; }
  if((b=e.target.closest('[data-drill]')) && b.dataset.drill!=='official'){
    if(b.dataset.drill==='due'){ var items=shuffle(dueItems().map(function(x){ return x.q; })); startQuiz(items,'review'); }
    else { var cs={}; conceptScores().forEach(function(o){ cs[o.concept]=o.score; }); var pool=shuffle(QLIST.filter(function(q){ return q.type!=='flash'; })).sort(function(x,y){ return (cs[y.concept]||0)-(cs[x.concept]||0); }).slice(0,10); startQuiz(pool,'weak'); }
    return; }
  if((b=e.target.closest('[data-pattern]'))){ var pat=WEAK.patterns.filter(function(x){ return x.id===b.dataset.pattern; })[0]; if(pat) startQuiz(patternPool(pat).slice(0,10),'weak'); return; }
  if((b=e.target.closest('[data-drill="official"]'))){ startQuiz(shuffle(openOfficialMisses().map(function(x){ return x.q; })),'review'); return; }
  if((b=e.target.closest('[data-concept]'))){ var cq=shuffle(QLIST.filter(function(q){ return q.concept===b.dataset.concept; })); startQuiz(cq,'weak'); return; }
  if((b=e.target.closest('[data-retry]'))){ startQuiz([QBYID[b.dataset.retry]],'review'); return; }
  if((b=e.target.closest('[data-gonote]'))){ e.preventDefault(); var p=b.dataset.gonote.split('|'); studyModule=p[0]; setView('study'); setTimeout(function(){ var tgt=document.getElementById(p[1]); if(tgt) tgt.scrollIntoView({block:'start'}); }, 30); return; }
  if((b=e.target.closest('[data-pick]'))){ answer(b.dataset.pick); return; }
  if((b=e.target.closest('[data-flash]'))){ var q=quiz.items[quiz.i]; record(q, b.dataset.flash, b.dataset.flash==='got'); nextQ(); return; }
  if(e.target.closest('#reveal')){ quiz.revealed=true; renderQuestion($('view-quiz')); return; }
  if(e.target.closest('#nextQ')){ nextQ(); return; }
  if(e.target.closest('#quitQuiz')){ quiz=null; renderQuiz(); return; }
  if(e.target.closest('#startQuiz')){ startQuiz(buildPool()); return; }
  if(e.target.closest('#retryWrong')){ var w=quiz.results.filter(function(x){ return !x.correct; }).map(function(x){ return x.q; }); startQuiz(shuffle(w),'review'); return; }
  if(e.target.closest('#newQuiz')){ quiz=null; renderQuiz(); return; }
  if(e.target.closest('#exportBtn')){ exportJSON(); return; }
  if(e.target.closest('#clearBtn')){
    if(!clearArmed){ clearArmed=true; e.target.closest('#clearBtn').textContent=t('i_clear2'); setTimeout(function(){ clearArmed=false; var cb=$('clearBtn'); if(cb) cb.textContent=t('i_clear'); }, 4000); return; }
    clearArmed=false; STORE={ owner:'guest', attempts:[], progress:{read:{},settings:{}} }; saveLocal(); $('clearMsg').textContent=t('i_cleared'); render(); return; }
  // setup toggles
  var lab=e.target.closest('label.opt'); if(lab && $('view-quiz').contains(lab)){ setTimeout(function(){
    var inp=lab.querySelector('input'); if(inp.dataset.smod!==undefined) SETUP.modules[inp.dataset.smod]=inp.checked; if(inp.dataset.ssubj!==undefined) modulesOf(inp.dataset.ssubj).forEach(function(m){ SETUP.modules[m.id]=inp.checked; }); if(inp.dataset.stype!==undefined) SETUP.types[inp.dataset.stype]=inp.checked;
    if(inp.dataset.scount!==undefined) SETUP.count=parseInt(inp.dataset.scount,10); if(inp.dataset.smode!==undefined) SETUP.mode=inp.dataset.smode;
    renderSetup($('view-quiz')); },0); }
});

/* language change: re-render dynamic content */
window.APP_LANG_LISTENERS = window.APP_LANG_LISTENERS || [];
window.APP_LANG_LISTENERS.push(function(){ render(); });

/* ── boot ───────────────────────────────────────────────────────────── */
loadLocal();
$('view-home').innerHTML='<p class="empty">'+esc(t('loading'))+'</p>';
loadContent().then(function(){
  var hash=(location.hash||'').replace('#',''); if(['home','study','quiz','review','insights'].indexOf(hash)>=0) view=hash;
  setView(view);
}).catch(function(e){ console.error(e); $('view-home').innerHTML='<div class="panel"><p class="empty">'+esc(t('loadFail'))+'</p></div>'; });
})();
